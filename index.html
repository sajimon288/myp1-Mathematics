<style>
/* ============================================================
   EtonHouse MYP 1 — Year 7 practice companion
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --red: #db3832;
  --red-dark: #b32822;
  --ink: #22252a;
  --ink-soft: #3c414a;
  --muted: #6b7280;
  --faint: #6b7280;
  --line: #e8e2da;
  --line-soft: #f0ece6;
  --bg: #f6f3ee;
  --card: #ffffff;
  --paper: #fffdf9;
  --gold: #c08a2e;
  --green: #137a5a;
  --green-soft: #e6f4ee;
  --red-soft: #fdeceb;
  --blue: #2f6fb0;
  --shadow-sm: 0 1px 2px rgba(24, 28, 35, .05), 0 4px 14px rgba(24, 28, 35, .04);
  --shadow-md: 0 2px 4px rgba(24, 28, 35, .05), 0 16px 40px rgba(24, 28, 35, .08);
  --radius: 16px;
  --radius-sm: 11px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(219, 56, 50, .07), transparent 60%),
    radial-gradient(900px 460px at -10% 30%, rgba(192, 138, 46, .06), transparent 55%),
    var(--bg);
  line-height: 1.65;
  font-size: 18px;
  min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; }
a { color: inherit; }
img { max-width: 100%; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 18px;
  height: 74px; padding: 0 26px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.logo { height: 34px; width: auto; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap; }
.brand-text strong { font-size: 17px; letter-spacing: .01em; }
.brand-text span { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.topstats { margin-left: auto; display: flex; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  font-size: 14.5px; font-weight: 650;
  background: #f4f1ec; color: var(--ink-soft);
  border: 1px solid var(--line-soft);
  white-space: nowrap;
}
.chip-streak { color: #9a5b13; background: #fdf4e5; border-color: #f3e3c5; }
.menu-btn {
  display: none; width: 40px; height: 40px; border-radius: 11px;
  border: 1px solid var(--line); background: #fff; font-size: 20.5px;
}

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); max-width: 1420px; margin: 0 auto; }
.sidebar {
  position: sticky; top: 74px; align-self: start;
  height: calc(100vh - 74px); overflow-y: auto;
  border-right: 1px solid var(--line);
  padding: 22px 18px 26px;
}
.side-inner { display: flex; flex-direction: column; min-height: 100%; }
.search {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border-radius: 11px;
  background: #fff; border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.search span { color: var(--faint); font-size: 19.5px; }
.search input { border: 0; outline: 0; width: 100%; background: transparent; font-size: 15.5px; }
.search input::placeholder { color: var(--faint); }
.search-results {
  margin-top: 8px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-md); overflow: hidden;
}
.search-hit {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line-soft);
}
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover { background: #faf8f4; }
.sh-glyph {
  flex: none; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; color: #fff; font-size: 12.5px; font-weight: 800;
}
.search-hit strong { display: block; font-size: 14.5px; line-height: 1.3; }
.search-hit small { color: var(--muted); font-size: 12px; }
.no-hit { padding: 12px; font-size: 14.5px; color: var(--muted); }

.nav { margin-top: 20px; }
.nav-label {
  font-size: 12px; font-weight: 800; letter-spacing: .12em;
  text-transform: uppercase; color: var(--faint);
  margin: 16px 8px 7px;
}
.nav-link {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: 10px; text-align: left;
  font-size: 15.5px; font-weight: 600; color: var(--ink-soft);
}
.nav-link:hover { background: #fff; box-shadow: var(--shadow-sm); }
.nav-link span { width: 18px; text-align: center; color: var(--red); }
.nav-unit {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 8px; border-radius: 10px; text-align: left;
}
.nav-unit:hover { background: #fff; box-shadow: var(--shadow-sm); }
.nu-glyph {
  flex: none; width: 27px; height: 27px; border-radius: 8px;
  display: grid; place-items: center;
  color: #fff; background: var(--uc); font-size: 11px; font-weight: 800;
  background: color-mix(in srgb, var(--uc) 78%, #111827);
}
.nu-text { flex: 1; min-width: 0; }
.nu-name { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nu-bar { display: block; height: 3px; margin-top: 4px; border-radius: 3px; background: #eee9e2; overflow: hidden; }
.nu-bar i { display: block; height: 100%; background: var(--uc); border-radius: 3px; }
.nu-pct { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding-top: 24px; }
.overall { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.overall strong { color: var(--ink); }
.bar { height: 7px; border-radius: 99px; background: #ece7df; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #e8695f); border-radius: 99px; transition: width .4s ease; }
.reset { margin-top: 14px; font-size: 13px; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
.reset:hover { color: var(--red); }
.scrim { display: none; }

/* ---------- main ---------- */
.main { padding: 30px 36px 80px; min-height: calc(100vh - 74px); }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 30px;
  padding: 42px 44px;
  border-radius: 24px;
  background:
    radial-gradient(700px 300px at 88% 8%, rgba(219, 56, 50, .5), transparent 55%),
    linear-gradient(135deg, #20242a 0%, #2a2f37 55%, #352a2a 100%);
  color: #fff; box-shadow: var(--shadow-md);
}
.hero::after {
  content: ""; position: absolute; right: -80px; bottom: -120px;
  width: 340px; height: 340px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 0 0 40px rgba(255, 255, 255, .03), 0 0 0 90px rgba(255, 255, 255, .02);
  pointer-events: none;
}
.eyebrow {
  font-size: 12.5px; font-weight: 800; letter-spacing: .16em;
  text-transform: uppercase; color: #f0b9b4; margin-bottom: 10px;
}
.eyebrow.dark { color: var(--red-dark); }
.eyebrow.light { color: rgba(255, 255, 255, .7); }
.hero h1 {
  font-family: var(--serif); font-size: clamp(37.5px, 4.32vw, 55px);
  line-height: 1.06; font-weight: 600; letter-spacing: -.02em; margin-bottom: 14px;
}
.hero-sub { max-width: 560px; color: rgba(255, 255, 255, .74); font-size: 17px; line-height: 1.65; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-actions .btn { max-width: 100%; }
.hero-actions .btn-ghost { white-space: normal; text-align: left; overflow-wrap: anywhere; }
.hero-ring { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 1; }
.ring-holder { position: relative; width: 132px; height: 132px; }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-label strong { font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
.ring-label span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: rgba(255, 255, 255, .65); }
.hero-ring > p { margin-top: 12px; font-size: 14.5px; color: rgba(255, 255, 255, .78); }
.hero-last { color: rgba(255, 255, 255, .5) !important; margin-top: 4px !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: 11px;
  font-size: 15.5px; font-weight: 700; letter-spacing: .01em;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--red); color: #fff; box-shadow: 0 8px 22px rgba(219, 56, 50, .28); }
.btn-primary:hover { background: var(--red-dark); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: rgba(255, 255, 255, .09); color: #fff; border: 1px solid rgba(255, 255, 255, .2); }
.btn-ghost:hover { background: rgba(255, 255, 255, .16); }
.main .btn-ghost { background: #fff; color: var(--ink-soft); border: 1px solid var(--line); }
.main .btn-ghost:hover { background: #faf8f4; }
.btn-light { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
.btn-light:hover { background: #fff8f6; }

/* ---------- stat row ---------- */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.stat-card {
  display: flex; align-items: center; gap: 13px;
  padding: 16px 18px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow-sm);
}
.sc-glyph {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  display: grid; place-items: center; font-size: 18.5px;
  background: #fbf0ee; color: var(--red);
}
.stat-card strong { display: block; font-size: 24px; line-height: 1.15; letter-spacing: -.02em; }
.stat-card strong small { font-size: 14px; color: var(--faint); font-weight: 500; }
.stat-card span { font-size: 13px; color: var(--muted); }

/* ---------- section head ---------- */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 46px 0 18px; }
.section-head h2 { font-family: var(--serif); font-size: 34.5px; font-weight: 600; letter-spacing: -.02em; }
.section-note { max-width: 380px; font-size: 15px; color: var(--muted); }

/* ---------- unit grid ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; }
.unit-card {
  position: relative; display: flex; flex-direction: column;
  padding: 20px 21px 17px;
  background: var(--card); border: 1px solid var(--line);
  border-top: 3px solid var(--uc);
  border-radius: 14px; box-shadow: var(--shadow-sm);
  transition: transform .18s ease, box-shadow .18s ease;
}
.unit-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.uc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.uc-glyph {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: #f6f1ee;
  background: color-mix(in srgb, var(--uc) 11%, white);
  color: #343a42; font-size: 15px; font-weight: 800;
}
.uc-num { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.unit-card h3 { font-size: 19.5px; line-height: 1.25; letter-spacing: -.01em; margin-bottom: 7px; }
.unit-card p { font-size: 14.5px; color: var(--muted); line-height: 1.55; flex: 1; }
.uc-progress { display: flex; align-items: center; gap: 10px; margin: 15px 0 13px; }
.uc-progress .bar { flex: 1; height: 5px; }
.uc-progress .bar i { background: var(--uc); }
.uc-progress span { font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.uc-open {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--line-soft);
  font-size: 14.5px; font-weight: 700; color: var(--ink);
}
.uc-open span { color: var(--muted); transition: transform .15s ease; }
.unit-card:hover .uc-open span { transform: translateX(4px); }
.page-foot { margin-top: 50px; text-align: center; font-size: 13px; color: var(--faint); }

/* ---------- unit view ---------- */
.unit-hero {
  position: relative; overflow: hidden;
  padding: 26px 30px 28px; border-radius: 20px; color: #fff;
  background: linear-gradient(125deg, var(--uc), #1b1d21);
  background:
    radial-gradient(520px 240px at 92% -20%, rgba(255, 255, 255, .22), transparent 60%),
    linear-gradient(125deg, color-mix(in srgb, var(--uc) 82%, #1b1d21), color-mix(in srgb, var(--uc) 55%, #1b1d21));
  box-shadow: var(--shadow-md);
}
.back {
  font-size: 14px; font-weight: 650; color: rgba(255, 255, 255, .8);
  padding: 5px 0; margin-bottom: 16px; display: inline-block;
}
.back:hover { color: #fff; }
.main .back { color: var(--muted); }
.main .back:hover { color: var(--red-dark); }
.unit-hero .back { color: rgba(255, 255, 255, .92); font-weight: 700; }
.unit-hero .back:hover { color: #fff; }
.uh-row { display: flex; gap: 20px; align-items: flex-start; }
.uh-glyph {
  flex: none; width: 62px; height: 62px; border-radius: 16px;
  display: grid; place-items: center; font-size: 22px; font-weight: 800;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .22);
}
.unit-hero h1 { font-family: var(--serif); font-size: clamp(31px, 3.456vw, 44px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 8px; }
.uh-blurb { max-width: 720px; color: rgba(255, 255, 255, .76); font-size: 15.5px; }
.uh-foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 22px; }
.uh-progress { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 420px; }
.uh-progress .bar { flex: 1; background: rgba(255, 255, 255, .2); }
.uh-progress .bar i { background: #fff; }
.uh-progress span { font-size: 13px; color: rgba(255, 255, 255, .8); white-space: nowrap; }
.skill-list-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 34px 2px 14px; }
.skill-list-head h2 { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.skill-list-head p { font-size: 14.5px; color: var(--muted); }
.skill-list { display: flex; flex-direction: column; gap: 8px; }
.skill-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 10px 18px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; text-align: left;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.skill-row:hover { border-color: #d8cfc4; box-shadow: var(--shadow-sm); }
.sr-open {
  flex: 1; min-width: 0;
  display: grid; grid-template-columns: 44px minmax(0, 1fr) 190px 26px;
  align-items: center; gap: 14px;
  padding: 4px 0; text-align: left; background: none; border: 0;
}
.sr-open:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; border-radius: 8px; }
.sr-tools { display: flex; gap: 6px; flex: none; }
.sr-tool {
  flex: none; padding: 6px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; color: var(--red-dark);
  background: #fff5f4; border: 1px solid #f3d9d5; white-space: nowrap;
}
.sr-tool:hover { background: #fdeceb; border-color: #eabfba; }
.sr-tool-play { background: var(--red); border-color: var(--red); color: #fff; }
.sr-tool-play:hover { background: var(--red-dark); border-color: var(--red-dark); }
.sr-idx { font-size: 12.5px; font-weight: 800; color: var(--faint); letter-spacing: .06em; }
.sr-main { min-width: 0; }
.sr-name { display: block; font-size: 16.5px; font-weight: 650; line-height: 1.35; }
.sr-status { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.sr-progress { display: flex; align-items: center; gap: 10px; }
.sr-progress .bar { flex: 1; height: 5px; }
.sr-pct { font-size: 12px; color: var(--faint); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.sr-arrow { color: var(--faint); font-size: 17px; text-align: right; }
.skill-row:hover .sr-arrow { color: var(--red); }
.unit-tip {
  margin-top: 23px; padding: 17px 20px; border-radius: 12px;
  background: #fffaf2; border: 1px solid #f2e5cf;
  font-size: 14.5px; color: #7a5a24;
}
.unit-tip strong { color: #5f4415; }

/* ---------- practice ---------- */
.practice-top {
  display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
}
.practice-top .back { margin: 0; }
.practice-mode {
  font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--faint); padding-left: 12px; border-left: 1px solid var(--line);
}
.q-count { margin-left: auto; font-size: 14px; color: var(--muted); }
.q-count strong { color: var(--ink); }
.q-score {
  font-size: 14px; font-weight: 700; color: var(--green);
  background: var(--green-soft); border-radius: 99px; padding: 4px 11px;
}
.practice-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
.practice-card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 20px; padding: 28px 32px 26px;
  box-shadow: var(--shadow-md);
}
.dots { display: flex; gap: 6px; margin-bottom: 22px; }
.dot { flex: 1; height: 5px; border-radius: 99px; background: #ece7df; }
.dot.ok { background: var(--green); }
.dot.no { background: #e3a6a2; }
.dot.now { background: var(--ink); }
.q-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.q-unit {
  font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: #fff; background: var(--uc); background: color-mix(in srgb, var(--uc) 78%, #111827);
  padding: 3px 8px; border-radius: 6px;
}
.q-skill { font-size: 14px; color: var(--muted); font-weight: 600; }
.question {
  font-size: clamp(21px, 2.268vw, 26.5px); line-height: 1.55; font-weight: 500;
  letter-spacing: -.01em; padding: 4px 0 22px;
}
.question strong { font-weight: 750; }
.answer-row { display: flex; align-items: stretch; gap: 10px; max-width: 430px; }
.answer-input {
  flex: 1; min-width: 0; padding: 14px 16px;
  font-size: 23px; font-weight: 650;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; outline: none; letter-spacing: .01em;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.answer-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(219, 56, 50, .1); }
.answer-input:disabled { background: #faf8f4; color: var(--ink); opacity: 1; }
.frac-answer { display: flex; align-items: center; gap: 14px; }
.whole-input, .frac-part {
  border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; outline: none; text-align: center;
  color: var(--ink); font-weight: 700;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.whole-input { width: 88px; height: 56px; font-size: 23px; }
.frac-input-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.frac-part { width: 94px; height: 44px; font-size: 23px; }
.frac-input-line { width: 94px; height: 2px; border-radius: 2px; background: var(--ink); }
.whole-input:focus, .frac-part:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(219, 56, 50, .1); }
.whole-input:disabled, .frac-part:disabled { background: #faf8f4; color: var(--ink); opacity: 1; }
.whole-input::placeholder, .frac-part::placeholder { color: var(--faint); font-size: 13px; font-weight: 600; }
.unit-suffix {
  display: flex; align-items: center; padding: 0 14px; border-radius: 12px;
  background: #f4f1ec; color: #4b5563; font-size: 16px; font-weight: 600;
}
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 660px; }
.choice {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; text-align: left; font-size: 17px; font-weight: 550;
  transition: border-color .14s ease, background .14s ease, transform .14s ease;
}
.choice:hover { border-color: #cfc5b7; transform: translateY(-1px); }
.choice.sel { border-color: var(--red); background: #fff5f4; box-shadow: 0 0 0 3px rgba(219, 56, 50, .08); }
.choice:disabled { cursor: default; opacity: .75; }
.choice.sel:disabled { opacity: 1; }
.choice-key {
  flex: none; width: 25px; height: 25px; border-radius: 7px;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 800;
  background: #f2eee8; color: var(--muted);
}
.choice.sel .choice-key { background: var(--red); color: #fff; }
.choice-body { min-width: 0; }

.practice-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.feedback { margin-top: 22px; border-radius: 13px; padding: 16px 18px; animation: pop .25s ease; }
.feedback.ok { background: #eef8f3; border: 1px solid #c9e8da; }
.feedback.no { background: #fdf0ef; border: 1px solid #f3cfcc; }
.fb-head { display: flex; align-items: center; gap: 10px; }
.fb-head strong { font-size: 17px; }
.fb-icon {
  width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center;
  font-size: 15px; font-weight: 800; color: #fff;
}
.feedback.ok .fb-icon { background: var(--green); }
.feedback.no .fb-icon { background: var(--red); }
.fb-xp { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--green); }
.feedback.no .fb-xp { color: #a44a44; }
.fb-correct { margin-top: 9px; font-size: 15.5px; color: #8d3d38; }
.solution { margin-top: 12px; font-size: 15.5px; line-height: 1.7; color: #4c4436; background: rgba(255, 255, 255, .62); border-radius: 9px; padding: 12px 14px; }
.solution .work { display: inline-block; margin-top: 3px; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; background: #fff; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-soft); }
.hint-box { margin-top: 20px; padding: 14px 17px; border-radius: 12px; background: #fffaf0; border: 1px solid #f2e5cf; animation: pop .2s ease; }
.hint-box strong { color: #8a6420; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.hint-box p { margin-top: 4px; font-size: 15.5px; color: #7a5a24; }

.practice-side { display: flex; flex-direction: column; gap: 12px; }
.streak-card {
  display: flex; align-items: center; gap: 12px; padding: 16px 17px;
  background: #fff; border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-sm);
}
.streak-card strong { display: block; font-size: 22px; letter-spacing: -.02em; }
.streak-card span { font-size: 12.5px; color: var(--muted); }
.tip-card { padding: 16px 17px; background: #fff; border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-sm); }
.tip-card h4 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.tip-card p { font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; }
.tip-card .bar { margin-top: 11px; height: 5px; }
.tip-card.soft { background: #fdfaf4; border-color: #f0e7d7; }

/* ---------- summary ---------- */
.summary { max-width: 680px; margin: 20px auto; text-align: center; padding: 38px 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-md); }
.summary-stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
.star { font-size: 39px; color: #e6ded2; line-height: 1; }
.star.on { color: var(--gold); animation: starPop .35s ease both; }
.summary h1 { font-family: var(--serif); font-size: clamp(33px, 4.32vw, 46px); font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
.summary-sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
.summary-ring { position: relative; width: 150px; height: 150px; margin: 0 auto 24px; }
.summary-ring .ring-label strong { color: var(--ink); font-size: 34.5px; }
.summary-ring .ring-label span { color: var(--muted); }
.summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 26px; }
.summary-stats div { padding: 14px 10px; background: #faf8f4; border-radius: 11px; }
.summary-stats strong { display: block; font-size: 23px; letter-spacing: -.02em; }
.summary-stats span { font-size: 12.5px; color: var(--muted); }
.summary-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.summary-note { margin-top: 18px; font-size: 13px; color: var(--faint); }

/* ---------- question visuals ---------- */
.qtable { border-collapse: collapse; margin: 12px 0 4px; font-size: 16px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); }
.qtable th, .qtable td { padding: 8px 18px; border: 1px solid var(--line); text-align: center; }
.qtable th { background: #f7f3ed; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.qsvg { display: block; max-width: 100%; height: auto; margin: 16px auto 6px; background: #fff; border: 1px solid var(--line-soft); border-radius: 12px; padding: 6px; }
.qsvg.geo { max-width: 440px; }
.qsvg.geo.wide { max-width: 520px; }
.qsvg.grid { max-width: 360px; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; position: relative; top: -0.1em; text-align: center; line-height: 1.05; margin: 0 2px; }
.frac span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; }
.frac span:last-child { padding: 1px 3px 0; }
.datalist { display: inline-block; margin-top: 8px; padding: 7px 13px; background: #f7f3ed; border-radius: 8px; font-weight: 650; letter-spacing: .02em; font-size: .8em; }
.dotplot { margin: 16px 0 4px; padding: 14px 16px 8px; background: #fff; border: 1px solid var(--line-soft); border-radius: 12px; }
.dp-cols { display: flex; align-items: flex-end; gap: 12px; justify-content: center; flex-wrap: wrap; }
.dp-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.dp-stack { display: flex; flex-direction: column-reverse; gap: 3px; min-height: 12px; }
.dd { width: 11px; height: 11px; border-radius: 50%; background: var(--red); flex: none; }
.dp-label { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 4px; min-width: 22px; text-align: center; }
.dp-unit { text-align: center; font-size: 12px; color: var(--faint); margin-top: 4px; }
.barchart { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 18px 0 4px; padding: 16px 16px 8px; background: #fff; border: 1px solid var(--line-soft); border-radius: 12px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bar-val { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.chart-bar { width: 34px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #e8695f, var(--red)); }
.bar-lab { font-size: 12px; color: var(--muted); }
.chart-unit { text-align: center; font-size: 12px; color: var(--faint); }
.pie-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 18px 0 4px; padding: 16px; background: #fff; border: 1px solid var(--line-soft); border-radius: 12px; }
.pie { width: 130px; height: 130px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06); }
.pie-legend { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-soft); }
.pie-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }

/* ---------- IB MYP unit notes ---------- */
.inline-link {
  color: var(--red-dark); font-size: 14px; font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
}
.inline-link:hover { color: #8f1f1a; }
.myp-panel {
  margin-top: 22px; padding: 20px 22px;
  background: #fffaf3; border: 1px solid #f0e3cf;
  border-left: 4px solid var(--uc); border-radius: 14px;
}
.mp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.mp-head h2 { font-family: var(--serif); font-size: 27.5px; font-weight: 600; letter-spacing: -.01em; }
.mp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; margin: 15px 0; }
.mp-grid > div { min-width: 0; }
.mp-grid span, .mc-grid span {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: #6b5c46; margin-bottom: 2px;
}
.mp-grid strong, .mc-grid strong { font-size: 15px; line-height: 1.45; color: var(--ink); font-weight: 650; }
.mp-soi, .mc-soi {
  border-top: 1px dashed #e8d9c2; padding-top: 12px;
  font-family: var(--serif); font-size: 18.5px; line-height: 1.5; color: var(--ink);
}
.mp-soi strong, .mp-note strong, .mc-note strong {
  display: block; font-family: var(--font); font-size: 11px; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase; color: var(--red-dark); margin-bottom: 3px;
}
.mp-note { margin-top: 12px; font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.mp-overview {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e8d9c2;
  font-size: 15px; line-height: 1.65; color: var(--ink-soft);
}
.mp-overview strong {
  display: block; font-family: var(--font); font-size: 11px; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase; color: var(--red-dark); margin-bottom: 3px;
}

.teacher-hero {
  background: linear-gradient(135deg, #20242a, #3a2b2a);
  border-radius: 22px; padding: 38px 40px; color: #fff; box-shadow: var(--shadow-md);
}
.teacher-hero h1 {
  font-family: var(--serif); font-size: clamp(35px, 4.32vw, 50.5px);
  font-weight: 600; letter-spacing: -.02em; line-height: 1.08; margin-bottom: 10px;
}
.teacher-hero > p:not(.eyebrow) { max-width: 760px; color: rgba(255, 255, 255, .76); font-size: 16.5px; line-height: 1.65; }
.criteria-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.criteria-legend span {
  display: inline-flex; gap: 6px; align-items: center;
  padding: 6px 11px; border-radius: 999px;
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
  font-size: 12.5px; color: rgba(255, 255, 255, .88);
}
.criteria-legend b { color: #fff; }
.teacher-intro { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
.teacher-intro > div {
  background: #fff; border: 1px solid var(--line); border-radius: 13px;
  padding: 15px 17px; box-shadow: var(--shadow-sm);
}
.teacher-intro h2 { font-size: 15px; margin-bottom: 5px; }
.teacher-intro p { font-size: 14px; line-height: 1.55; color: var(--muted); }
.teacher-disclaimer {
  background: #fffaf2; border: 1px solid #f2e5cf; border-radius: 12px;
  padding: 12px 16px; font-size: 14.5px; color: #7a5a24; margin-bottom: 22px;
}
.teacher-disclaimer strong { display: inline-block; margin-right: 5px; }
.myp-cards { display: flex; flex-direction: column; gap: 16px; }
.myp-card {
  background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--uc);
  border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-sm);
}
.mc-head { display: flex; gap: 14px; align-items: flex-start; }
.mc-glyph {
  width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center;
  background: #f6f1ee; background: color-mix(in srgb, var(--uc) 11%, white);
  color: #343a42; font-size: 16px; font-weight: 800; flex: none;
}
.mc-title { flex: 1; min-width: 0; }
.mc-title h2 {
  font-family: var(--serif); font-size: 27.5px; font-weight: 600;
  line-height: 1.15; letter-spacing: -.01em;
}
.mc-title .eyebrow { margin-bottom: 3px; }
.mc-key {
  flex: none; background: #fbf0ee; border: 1px solid #f3d9d5; color: #8d3d38;
  padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 800;
  letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.mc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; margin: 16px 0; }
.mc-explanation {
  margin: 0 0 14px; padding: 14px 16px;
  background: #f7f9fb; border: 1px solid #e2e9f0; border-radius: 10px;
}
.mc-explanation > strong {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: #365a7c; margin-bottom: 4px;
}
.mc-explanation > p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
.mc-keyideas { margin-top: 10px; }
.mc-keyideas b {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: #365a7c; margin-bottom: 4px;
}
.mc-keyideas ul { margin: 0 0 0 17px; padding: 0; }
.mc-keyideas li { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 3px; }
.mc-soi { margin-bottom: 14px; }
.mc-soi span {
  display: block; font-family: var(--font); font-size: 11px; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase; color: var(--red-dark); margin-bottom: 3px;
}
.mc-questions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.mc-questions p {
  background: #faf8f4; border-radius: 10px; padding: 10px 12px;
  font-size: 14px; line-height: 1.5; color: var(--ink-soft);
}
.mc-questions b {
  display: block; font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--red-dark); margin-bottom: 3px;
}
.mc-note { background: #fffaf2; border: 1px solid #f2e5cf; border-radius: 10px; padding: 12px 14px; }
.mc-note p { font-size: 14.5px; line-height: 1.6; color: #6b4f22; }

/* ---------- skill guide modal ---------- */
body.modal-open { overflow: hidden; }
.modal-scrim {
  position: fixed; inset: 0; z-index: 200; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(20, 22, 26, .58); animation: fadeIn .15s ease;
}
.guide-modal {
  position: relative; width: min(760px, 100%); max-height: min(86vh, 900px);
  overflow: auto; background: #fff; border-radius: 20px;
  padding: 26px 28px 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
  animation: modalIn .22s ease;
}
.modal-x {
  position: absolute; top: 14px; right: 16px; width: 34px; height: 34px;
  border-radius: 50%; background: #f4f1ec; font-size: 23px; line-height: 1;
  color: var(--ink-soft); display: grid; place-items: center;
}
.modal-x:hover { background: #ece7df; }
.guide-modal .eyebrow { margin-bottom: 4px; }
.guide-modal h2 {
  font-family: var(--serif); font-size: clamp(26.5px, 3.24vw, 35px);
  font-weight: 600; letter-spacing: -.02em; line-height: 1.15; padding-right: 42px;
}
.guide-tabs { display: flex; gap: 4px; margin: 18px 0 16px; border-bottom: 1px solid var(--line); }
.guide-tab {
  padding: 9px 12px; font-size: 14.5px; font-weight: 750; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.guide-tab:hover { color: var(--ink); }
.guide-tab.active { color: var(--red-dark); border-bottom-color: var(--red); }
.guide-about, .guide-method { margin-bottom: 14px; }
.guide-about > strong, .guide-method > strong, .guide-keyideas > strong {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: var(--red-dark); margin-bottom: 3px;
}
.guide-about p, .guide-method p { font-size: 15.5px; line-height: 1.65; color: var(--ink-soft); }
.guide-keyideas { margin-bottom: 14px; }
.guide-keyideas ul { margin: 0 0 0 18px; padding: 0; }
.guide-keyideas li { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin-bottom: 3px; }
.guide-label {
  font-size: 11px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: #365a7c; margin-bottom: 6px;
}
.guide-example { padding: 15px 17px; background: #faf8f4; border: 1px solid var(--line); border-radius: 12px; }
.guide-q { font-size: 18.5px; line-height: 1.55; font-weight: 600; margin-bottom: 10px; }
.guide-sol { font-size: 15.5px; line-height: 1.7; color: var(--ink-soft); }
.guide-answer { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 15px; }
.guide-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
.guide-btn {
  padding: 9px 14px; border-radius: 9px; font-size: 14px; font-weight: 700;
  background: #fff; border: 1px solid var(--line); color: var(--ink-soft);
}
.guide-btn:hover { background: #faf8f4; }
.guide-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.guide-btn.primary:hover { background: var(--red-dark); }
.guide-btn:disabled { opacity: .45; cursor: not-allowed; }
.modal-x:focus-visible, .guide-btn:focus-visible, .guide-tab:focus-visible, .sr-tool:focus-visible {
  outline: 2px solid var(--red); outline-offset: 2px;
}
.guide-player { padding: 18px; background: #f7f9fb; border: 1px solid #e2e9f0; border-radius: 14px; }
.guide-step-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #365a7c; }
.guide-step {
  min-height: 110px; display: flex; align-items: center; padding: 10px 0;
  font-size: clamp(20px, 2.376vw, 24px); line-height: 1.55; font-weight: 500;
  color: var(--ink); animation: stepIn .28s ease;
}
.guide-step strong { font-weight: 800; }
.guide-dots { display: flex; gap: 5px; margin: 6px 0 15px; }
.guide-dot { flex: 1; height: 4px; border-radius: 99px; background: #dce4ee; }
.guide-dot.done { background: #365a7c; }
.guide-dot.now { background: var(--red); }
.guide-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.guide-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--faint); }
.guide-speed {
  display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.guide-speed select {
  font: inherit; font-size: 12.5px; padding: 5px 7px;
  border: 1px solid var(--line); border-radius: 7px;
  background: #fff; color: var(--ink-soft);
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes stepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Math Sprint game ---------- */
.sprint-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  margin-top: 18px; padding: 22px 26px; border-radius: 16px; color: #fff;
  background:
    radial-gradient(600px 240px at 90% -20%, rgba(219, 56, 50, .45), transparent 60%),
    linear-gradient(120deg, #1f242b, #2b3037);
  box-shadow: var(--shadow-md);
}
.sprint-banner h2 { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.sprint-banner p { max-width: 620px; margin-top: 4px; color: rgba(255, 255, 255, .72); font-size: 14px; line-height: 1.55; }
.sprint-banner .eyebrow { color: #f0b9b4; margin-bottom: 3px; }
.sprint-banner-action { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.sprint-best { font-size: 11px; color: rgba(255, 255, 255, .7); }
.sprint-best strong { color: #fff; }

.game-hero {
  padding: 38px 40px; border-radius: 22px; color: #fff; box-shadow: var(--shadow-md);
  background:
    radial-gradient(600px 300px at 90% 0%, rgba(219, 56, 50, .55), transparent 55%),
    linear-gradient(135deg, #20242a, #3a2b2a);
}
.game-hero h1 { font-family: var(--serif); font-size: clamp(34px, 4.5vw, 50px); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-bottom: 10px; }
.game-hero > p:not(.eyebrow) { max-width: 720px; color: rgba(255, 255, 255, .76); font-size: 15px; line-height: 1.6; }
.game-rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.game-rule { padding: 14px 16px; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); }
.game-rule strong { display: block; font-size: 20px; color: #fff; letter-spacing: -.02em; }
.game-rule span { font-size: 11.5px; color: rgba(255, 255, 255, .7); }
.game-keyhint { margin-top: 14px; font-size: 12px; color: rgba(255, 255, 255, .62); }
.game-keyhint strong { color: #fff; }
.game-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 16px; }
.game-topic {
  display: flex; align-items: center; gap: 10px; padding: 13px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: #fff;
  text-align: left; box-shadow: var(--shadow-sm);
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.game-topic:hover { border-color: #cfc5b7; transform: translateY(-2px); box-shadow: var(--shadow-md); }
.game-topic-glyph {

}
.game-topic-text { flex: 1; min-width: 0; }
.game-topic-text strong { display: block; font-size: 13.5px; line-height: 1.25; }

.game-topic-best { flex: none; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.game-mixed {
  grid-column: 1 / -1; color: #fff; border-color: transparent;
  background: linear-gradient(120deg, #20242a, #3a2b2a);
}
.game-mixed .game-topic-glyph { background: rgba(255, 255, 255, .13); color: #fff; }
.game-mixed .game-topic-text span, .game-mixed .game-topic-best { color: rgba(255, 255, 255, .7); }

.sprint { max-width: 860px; margin: 0 auto; }
.sprint-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sprint-top .back { margin: 0; }
.sprint-stat {
  display: flex; align-items: center; gap: 6px; padding: 7px 11px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-size: 11.5px; color: var(--muted);
}
.sprint-stat strong { font-size: 17px; color: var(--ink); letter-spacing: -.01em; }
.sprint-combo { font-weight: 750; color: var(--red-dark); background: #fff5f4; border-color: #f3d9d5; }
.sprint-combo.hot { color: #9a5b13; background: #fff4e0; border-color: #f3e3c5; }
.sprint-timer { margin-left: auto; font-weight: 700; color: var(--ink); }
.sprint-finish { margin-left: 2px; padding: 7px 10px; border-radius: 9px; font-size: 11px; font-weight: 700; color: var(--red-dark); background: #fff5f4; border: 1px solid #f3d9d5; }
.sprint-finish:hover { background: #fdeceb; }
.sprint-timer.low { color: var(--red-dark); background: #fdeceb; border-color: #f3d9d5; animation: sprintPulse 1s infinite; }
.sprint-timebar { height: 6px; margin-bottom: 10px; border-radius: 99px; background: #e9e3da; overflow: hidden; }
.sprint-timebar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #137a5a, #34d399); transition: width 1s linear; }
.sprint-track { position: relative; height: 22px; margin: 0 16px 22px; border-radius: 99px; background: #e9e3da; }
.sprint-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #db3832, #f59e0b); transition: width .35s ease; }
.sprint-rocket { position: absolute; top: -10px; transform: translateX(-50%); font-size: 26px; transition: left .35s ease; }
.sprint-card { padding: 28px 30px; border: 1px solid var(--line); border-radius: 20px; background: #fff; box-shadow: var(--shadow-md); }
.sprint-topic { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.sprint-question { margin: 10px 0 22px; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.5; font-weight: 600; }
.sprint-question .qsvg { max-width: 300px; margin-top: 10px; }
.sprint-question .qsvg.grid { max-width: 260px; }
.sprint-question .barchart, .sprint-question .pie-row, .sprint-question .dotplot { max-width: 340px; margin-left: auto; margin-right: auto; }
.sprint-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sprint-choice {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
  text-align: left; font-size: 17px; font-weight: 600;
  transition: border-color .14s ease, transform .14s ease, background .14s ease;
}
.sprint-choice:hover { border-color: #cfc5b7; transform: translateY(-1px); }
.sprint-choice:disabled { cursor: default; opacity: 1; }
.sprint-choice.correct { border-color: var(--green); background: #eef8f3; }
.sprint-choice.wrong { border-color: var(--red); background: #fdf0ef; }
.sc-key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: #f2eee8; color: var(--muted); font-size: 11px; font-weight: 800; }
.sprint-choice.correct .sc-key { background: var(--green); color: #fff; }
.sprint-choice.wrong .sc-key { background: var(--red); color: #fff; }
.sc-body { min-width: 0; }
.sprint-feedback { min-height: 24px; margin-top: 14px; font-size: 13.5px; font-weight: 700; }
.sprint-feedback.ok { color: var(--green); }
.sprint-feedback.no { color: var(--red-dark); }
.sprint-card.flash-ok { animation: sprintPop .3s ease; }
.sprint-card.flash-no { animation: sprintShake .3s ease; }

.sprint-end { max-width: 760px; margin: 20px auto; padding: 34px 30px; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: var(--shadow-md); text-align: center; }
.sprint-stars { font-size: 38px; letter-spacing: 6px; color: var(--gold); margin-bottom: 8px; }

.sprint-stats div { padding: 12px 8px; border-radius: 10px; background: #faf8f4; }
.sprint-stats strong { display: block; font-size: 20px; letter-spacing: -.02em; }
.sprint-stats span { font-size: 10.5px; color: var(--muted); }
.sprint-review { text-align: left; margin: 20px 0; }
.sprint-review h2 { font-size: 15px; margin-bottom: 8px; }
.review-item { padding: 13px 15px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.review-topic { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--red-dark); }
.review-q { margin: 3px 0 5px; font-size: 13.5px; font-weight: 600; }
.review-answer { font-size: 12.5px; color: var(--ink-soft); }
.review-sol summary { margin-top: 5px; font-size: 11.5px; font-weight: 700; color: var(--red-dark); cursor: pointer; }
.review-sol div { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.55; }
.review-more { font-size: 12px; color: var(--muted); }
.sprint-actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin-top: 18px; }

@keyframes sprintPop { 0% { transform: scale(.985); } 50% { transform: scale(1.01); } 100% { transform: scale(1); } }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);

}

@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes starPop { 0% { transform: scale(.3) rotate(-20deg); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

  .stat-row { gap: 10px; }
  .stat-card { padding: 13px; gap: 10px; }
  .stat-card strong { font-size: 19.5px; }
  .sc-glyph { width: 34px; height: 34px; }
  .unit-grid { grid-template-columns: 1fr; }
  .choice-grid { grid-template-columns: 1fr; }
  .practice-card { padding: 21px 18px; }
  .practice-side { grid-template-columns: 1fr; }
  .skill-row { flex-wrap: wrap; padding: 10px 12px; }
  .sr-open { grid-template-columns: 34px minmax(0, 1fr) 26px; gap: 10px; }
  .sr-tools { margin-left: 44px; }
  .sr-progress { display: none; }
  .unit-hero { padding: 22px 20px; }
  .uh-glyph { width: 48px; height: 48px; font-size: 17px; }
  .uh-foot { flex-direction: column; align-items: stretch; }
  .summary { padding: 28px 18px; }
  .summary-stats { grid-template-columns: 1fr; }
  .mp-head { flex-direction: column; }
  .mp-grid, .mc-grid { grid-template-columns: 1fr; }
  .teacher-hero { padding: 28px 22px; }
  .myp-card { padding: 18px; }
  .mc-head { flex-wrap: wrap; }
  .mc-key { margin-left: 0; }
  .modal-scrim { padding: 10px; }
  .guide-modal { padding: 20px 18px; border-radius: 16px; max-height: 92vh; }
  .guide-step { min-height: 90px; font-size: 20.5px; }
  .guide-actions .guide-btn, .guide-controls .guide-btn { flex: 1 1 auto; }
  .sprint-banner { flex-direction: column; align-items: flex-start; padding: 20px; }
  .sprint-banner-action { align-items: flex-start; }

  .game-topics { grid-template-columns: 1fr; }

}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media print {
  .topbar, .sidebar, .practice-side, .practice-actions, .scrim { display: none !important; }
  .shell { display: block; }
  .main { padding: 0; }

  .myp-card, .myp-panel { break-inside: avoid; box-shadow: none; }
  .modal-scrim { display: none; }
}

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">This practice site needs JavaScript enabled.</p></noscript>
<script>
(function () {
"use strict";
/* ============================================================
   MYP 1 Year 7 Practice — core helpers
   ============================================================ */

/* ---------- seeded random ---------- */
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RI = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function shuffle(r, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(r, arr, n) {
  return shuffle(r, arr).slice(0, n);
}

/* ---------- number theory ---------- */
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a || 1;
}
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
function isPrime(n) {
  if (n < 2) return false;
  if (n % 2 === 0) return n === 2;
  for (let i = 3; i * i <= n; i += 2) if (n % i === 0) return false;
  return true;
}
function primeFactors(n) {
  const out = [];
  let m = n;
  for (let p = 2; p * p <= m; p++) {
    while (m % p === 0) { out.push(p); m /= p; }
  }
  if (m > 1) out.push(m);
  return out;
}

/* ---------- fractions ---------- */
function F(n, d) {
  if (d === undefined) d = 1;
  if (d === 0) d = 1;
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  return { n: n / g, d: d / g };
}
function fval(f) { return f.n / f.d; }
function fstr(f) { return f.d === 1 ? String(f.n) : f.n + '/' + f.d; }
function fHTML(f) {
  if (f.d === 1) return String(f.n);
  return '<span class="frac"><span>' + f.n + '</span><span>' + f.d + '</span></span>';
}
function fh(n, d) { return fHTML({ n: n, d: d }); }
function mixedParts(f) {
  const sign = f.n < 0 ? -1 : 1;
  const n = Math.abs(f.n);
  return { whole: sign * Math.floor(n / f.d), rem: n % f.d, d: f.d, sign: sign };
}
function mixedStr(f) {
  const m = mixedParts(f);
  const a = Math.abs(m.whole);
  if (m.rem === 0) return String(f.n);
  return (f.n < 0 ? '-' : '') + (a ? a + ' ' : '') + m.rem + '/' + m.d;
}
function mixedHTML(f) {
  const m = mixedParts(f);
  if (m.rem === 0) return String(f.n);
  return (f.n < 0 ? '−' : '') + (Math.abs(m.whole) ? Math.abs(m.whole) + ' ' : '') + fHTML(F(m.rem, m.d));
}
function randFrac(r, maxD, proper) {
  const d = RI(r, 2, maxD || 12);
  const n = proper === false ? RI(r, 1, d * 2) : RI(r, 1, d - 1);
  return F(n, d);
}
function improper(f) { return F(f.d * Math.abs(f.n) + 0, 1); }

/* ---------- decimals & formatting ---------- */
function round(x, dp) {
  const p = Math.pow(10, dp === undefined ? 4 : dp);
  return Math.round((x + Number.EPSILON) * p) / p;
}
function fmt(x, dp) {
  if (typeof x !== 'number' || !isFinite(x)) return String(x);
  if (Number.isInteger(x)) return x.toLocaleString('en-US');
  const v = round(x, dp === undefined ? 4 : dp);
  return v.toLocaleString('en-US', { maximumFractionDigits: dp === undefined ? 4 : dp });
}
function plain(x, dp) {
  if (typeof x !== 'number') return String(x);
  const v = round(x, dp === undefined ? 4 : dp);
  return String(v);
}
function money(x) { return '$' + Number(x).toFixed(2); }
function pct(x, dp) {
  const v = round(x, dp === undefined ? 1 : dp);
  return String(v) + '%';
}

/* ---------- answer parsing ---------- */
function parseNumber(input) {
  let s = String(input).trim();
  s = s.replace(/[$£€]/g, '').replace(/%/g, '').replace(/,/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return NaN;
  const mm = s.match(/^(-?\d+(?:\.\d+)?)\s+(\d+)\/(\d+)$/);
  if (mm) {
    const w = Number(mm[1]);
    const sign = w < 0 || /^-/.test(mm[1]) ? -1 : 1;
    const val = Math.abs(w) + Number(mm[2]) / Number(mm[3]);
    return sign * val;
  }
  if (/^-?\d+\s*\/\s*-?\d+$/.test(s)) {
    const parts = s.split('/');
    const a = Number(parts[0].trim()), b = Number(parts[1].trim());
    return b ? a / b : NaN;
  }
  if (/^-?\d+(?:\.\d+)?$/.test(s)) return Number(s);
  return NaN;
}
function parsePoint(input) {
  const m = String(input).match(/^\s*\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?\s*$/);
  if (!m) return null;
  return [Number(m[1]), Number(m[2])];
}
function parseRatio(input) {
  let s = String(input).trim().toLowerCase().replace(/\s+/g, ' ');
  let m = s.match(/^(-?\d+(?:\.\d+)?)\s*(?::|to|\/)\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  let a = Number(m[1]), b = Number(m[2]);
  if (!b) return null;
  const g = gcd(Math.round(Math.abs(a) * 1000), Math.round(Math.abs(b) * 1000)) || 1;
  return { a: a, b: b };
}
function normText(s) {
  return String(s)
    .toLowerCase()
    .replace(/<[^>]*>/g, '')
    .replace(/[×·]/g, '*')
    .replace(/÷/g, '/')
    .replace(/−/g, '-')
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function (d) { return '^' + '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(d); })
    .replace(/\s+/g, ' ')
    .trim();
}
function superscript(n) {
  const map = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  return String(n).split('').map(function (ch) { return map[ch] || ch; }).join('');
}
function parsePrimeFactor(input) {
  let s = String(input).toLowerCase();
  s = s.replace(/[×·]/g, ' ').replace(/\*/g, ' ').replace(/x/g, ' ');
  s = s.replace(/[²]/g, '^2').replace(/[³]/g, '^3').replace(/[⁴]/g, '^4')
       .replace(/[⁵]/g, '^5').replace(/[⁶]/g, '^6').replace(/[⁷]/g, '^7')
       .replace(/[⁸]/g, '^8').replace(/[⁹]/g, '^9');
  const tokens = s.split(/[\s,]+/).filter(Boolean);
  const out = [];
  for (const t of tokens) {
    const m = t.match(/^(\d+)(?:\^(\d+))?$/);
    if (!m) return null;
    const base = Number(m[1]);
    const exp = m[2] ? Number(m[2]) : 1;
    if (!isPrime(base)) return null;
    for (let i = 0; i < exp; i++) out.push(base);
  }
  out.sort((a, b) => a - b);
  return out;
}

/* ---------- answer checking ---------- */
function checkAnswer(q, response) {
  if (q.type === 'choice') return Number(response) === q.a;
  if (q.type === 'num') {
    const v = parseNumber(response);
    const tol = q.tol === undefined ? 1e-6 : q.tol;
    return isFinite(v) && Math.abs(v - q.a) <= tol;
  }
  if (q.type === 'frac') {
    const v = parseNumber(response);
    return isFinite(v) && Math.abs(v - fval(q.a)) <= 1e-6;
  }
  if (q.type === 'point') {
    const p = parsePoint(response);
    return !!p && Math.abs(p[0] - q.a[0]) < 1e-9 && Math.abs(p[1] - q.a[1]) < 1e-9;
  }
  if (q.type === 'ratio') {
    const p = parseRatio(response);
    if (!p) return false;
    const t = q.a;
    return Math.abs(p.a * t.b - p.b * t.a) < 1e-9;
  }
  if (q.type === 'text') {
    const n = normText(response);
    const ok = [q.a].concat(q.accept || []).map(normText);
    return ok.indexOf(n) !== -1;
  }
  if (q.type === 'pf') {
    const p = parsePrimeFactor(response);
    if (!p) return false;
    const target = q.a.slice().sort((a, b) => a - b);
    return p.length === target.length && p.every((v, i) => v === target[i]);
  }
  return false;
}

function answerDisplay(q) {
  if (q.type === 'frac') {
    const mp = mixedParts(q.a);
    const val = q.display && mp.whole !== 0 ? mixedHTML(q.a) : fHTML(q.a);
    return val + (q.unit ? ' ' + q.unit : '');
  }
  if (q.display) return q.display;
  if (q.type === 'choice') return q.choices[q.a];
  if (q.type === 'point') return '(' + q.a[0] + ', ' + q.a[1] + ')';
  if (q.type === 'ratio') return q.a.a + ':' + q.a.b;
  if (q.type === 'pf') {
    const counts = {};
    q.a.forEach(p => { counts[p] = (counts[p] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => a - b).map(p => counts[p] > 1 ? p + '^' + counts[p] : p).join(' × ');
  }
  if (q.type === 'num') return fmt(q.a) + (q.unit ? ' ' + q.unit : '');
  return String(q.a);
}

/* ---------- multiple choice ---------- */
function mc(r, correct, wrongs) {
  const all = [String(correct)];

function wrongNums(r, correct, n, min, max, step) {
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    let v = RI(r, min, max);
    if (step) v = Math.round(v / step) * step;
    if (v !== correct && out.indexOf(v) === -1) out.push(v);
  }
  return out;
}
function roundTo(x, place) { return Math.round(x / place) * place; }
function words(n) {

}
