S('expr', 'write-one', 'Write variable expressions: one operation', r => {
  const n = RI(r, 2, 12);
  const v = pick(r, ['n', 'x', 'y', 'm', 'p']);
  const items = [
    [n + ' more than ' + v, v + ' + ' + n, [n + v, v + ' − ' + n, n + ' − ' + v]],
    [n + ' less than ' + v, v + ' − ' + n, [v + ' + ' + n, n + ' − ' + v, n + ' × ' + v]],
    ['the product of ' + n + ' and ' + v, n + v, [v + ' + ' + n, v + ' − ' + n, fh(v, n)]],
    [v + ' divided by ' + n, fh(v, n), [fh(n, v), v + ' − ' + n, v + ' × ' + n]],
    ['the sum of ' + v + ' and ' + n, v + ' + ' + n, [v + ' − ' + n, n + ' − ' + v, n + v]],
    ['twice ' + v, '2' + v, [v + ' + 2', '2 + ' + v, fh(v, 2)]]
  ];
  const it = pick(r, items);
  return choiceQ(r, 'Which expression means “' + it[0] + '”?', it[1], it[2],
    '“' + it[0] + '” translates directly to <strong>' + it[1] + '</strong>.');
}, 'Look for the operation words: more than (+), less than (−), product (×), quotient (÷).');

S('expr', 'write-two', 'Write variable expressions: two operations', r => {
  const a = RI(r, 2, 9), b = RI(r, 2, 9);
  const v = pick(r, ['n', 'x', 'y', 'm']);
  const items = [
    [a + ' times a number, minus ' + b, a + v + ' − ' + b, [a + v + ' + ' + b, a + '(' + v + ' − ' + b + ')', a + ' − ' + b + v]],
    [b + ' more than ' + a + ' times a number', a + v + ' + ' + b, [b + v + ' + ' + a, a + '(' + v + ' + ' + b + ')', a + ' − ' + b + v]],
    ['the quotient of a number and ' + b + ', plus ' + a, fh(v, b) + ' + ' + a, [fh(v, '(' + b + ' + ' + a + ')'), fh(b, v) + ' + ' + a, v + ' + ' + fh(b, a)]],
    ['twice a number, increased by ' + b, '2' + v + ' + ' + b, ['2(' + v + ' + ' + b + ')', '2' + v + ' − ' + b, v + ' + 2' + b]]
  ];
  const it = pick(r, items);
  return choiceQ(r, 'Which expression means “' + it[0] + '”?', it[1], it[2],
    'Translate step by step: “' + it[0] + '” becomes <strong>' + it[1] + '</strong>.');
}, 'Translate the words in order, using a letter for the unknown number.');

S('expr', 'evaluate', 'Evaluate variable expressions', r => {
  const x = RI(r, 2, 9), a = RI(r, 2, 7), b = RI(r, 1, 20);
  const val = a * x + b;
  return {
    q: 'Evaluate <strong>' + a + 'x + ' + b + '</strong> when <strong>x = ' + x + '</strong>.',
    type: 'num', a: val,
    sol: 'Substitute x = ' + x + ': ' + a + '(' + x + ') + ' + b + '.<br>' +
      a + ' × ' + x + ' = ' + (a * x) + ', then ' + (a * x) + ' + ' + b + ' = <strong>' + val + '</strong>.'
  };
}, 'Replace the variable with its value, then follow the order of operations.');

S('expr', 'evaluate-multi', 'Evaluate multi-variable expressions', r => {
  const a = RI(r, 2, 12), b = RI(r, 2, 12), m = RI(r, 2, 5), n = RI(r, 2, 5);
  const val = m * a + n * b;
  return {
    q: 'Evaluate <strong>' + m + 'a + ' + n + 'b</strong> when <strong>a = ' + a + '</strong> and <strong>b = ' + b + '</strong>.',
    type: 'num', a: val,
    sol: m + '(' + a + ') + ' + n + '(' + b + ') = ' + (m * a) + ' + ' + (n * b) + ' = <strong>' + val + '</strong>.'
  };
}, 'Substitute each variable separately, then add.');

S('expr', 'terms', 'Identify terms and coefficients', r => {
  const a = RI(r, 2, 9), b = RI(r, 2, 9), c = RI(r, 2, 15);
  const v1 = pick(r, ['x', 'a', 'm']), v2 = pick(r, ['y', 'b', 'n']);
  const kind = RI(r, 1, 3);
  if (kind === 1) return {
    q: 'In the expression <strong>' + a + v1 + ' + ' + b + v2 + ' − ' + c + '</strong>, what is the coefficient of <strong>' + v2 + '</strong>?',
    type: 'num', a: b,
    sol: 'The coefficient is the number multiplying ' + v2 + ': <strong>' + b + '</strong>.'
  };
  if (kind === 2) return {
    q: 'How many terms are in <strong>' + a + v1 + ' + ' + b + v2 + ' − ' + c + '</strong>?',
    type: 'num', a: 3,
    sol: 'Terms are separated by + and − signs: ' + a + v1 + ', ' + b + v2 + ' and −' + c + '.<br>There are <strong>3 terms</strong>.'
  };
  return {
    q: 'What is the constant term in <strong>' + a + v1 + ' + ' + b + v2 + ' − ' + c + '</strong>?',
    type: 'num', a: -c,
    sol: 'The constant is the term with no variable: <strong>−' + c + '</strong>.'
  };
}, 'A coefficient multiplies a variable; a constant stands alone.');

S('expr', 'distribute', 'Multiply using the distributive property', r => {
  const a = RI(r, 2, 9), b = RI(r, 2, 9), c = RI(r, 2, 9);
  const v = pick(r, ['x', 'y', 'n']);
  const correct = a + v + ' + ' + (a * b);
  return choiceQ(r, 'Expand <strong>' + a + '(' + v + ' + ' + b + ')</strong> using the distributive property.',
    correct, [a + v + ' + ' + b, a + v + ' + ' + (a + b), (a + b) + v],
    'Multiply each term inside the brackets by ' + a + ':<br>' + a + ' × ' + v + ' = ' + a + v + ', and ' + a + ' × ' + b + ' = ' + (a * b) + '.<br>' +
    'So <strong>' + correct + '</strong>.');
}, 'Multiply the outside factor by every term inside the brackets.');

S('expr', 'factor', 'Factor expressions using the distributive property', r => {
  const g = RI(r, 2, 9);
  let m = RI(r, 2, 8), n = RI(r, 2, 8), guard = 0;
  while (gcd(m, n) !== 1 && guard++ < 50) { m = RI(r, 2, 8); n = RI(r, 2, 8); }
  const v = pick(r, ['x', 'y', 'm']);
  const correct = g + '(' + m + v + ' + ' + n + ')';
  return choiceQ(r, 'Factor <strong>' + (g * m) + v + ' + ' + (g * n) + '</strong> using the greatest common factor.',
    correct, [g + '(' + m + v + ' + ' + (g * n) + ')', (g * m) + '(' + v + ' + ' + n + ')', g + '(' + (m + n) + v + ')'],
    'The GCF of ' + (g * m) + ' and ' + (g * n) + ' is ' + g + '.<br>' +
    (g * m) + v + ' + ' + (g * n) + ' = <strong>' + correct + '</strong>.');
}, 'Take out the greatest common factor from every term.');

S('expr', 'like-terms', 'Add and subtract like terms', r => {
  const a = RI(r, 2, 9), b = RI(r, 2, 9), c = RI(r, 2, 12);
  const v = pick(r, ['x', 'y', 'n']);
  const correct = (a + b) + v + ' + ' + c;
  return choiceQ(r, 'Simplify <strong>' + a + v + ' + ' + c + ' + ' + b + v + '</strong>.',
    correct, [(a + b) + v + ' + ' + (c + 1), (a * b) + v + ' + ' + c, (a + b + c) + v],
    'Combine the like terms ' + a + v + ' and ' + b + v + ': ' + (a + b) + v + '.<br>' +
    'Keep the constant: <strong>' + correct + '</strong>.');
}, 'Only like terms (same variable) can be combined.');

S('expr', 'equivalent', 'Identify equivalent expressions', r => {
  const a = RI(r, 2, 8), b = RI(r, 2, 9), c = RI(r, 2, 9);
  const v = pick(r, ['x', 'y', 'n']);
  const correct = a + v + ' + ' + (a * b);
  return choiceQ(r, 'Which expression is equivalent to <strong>' + a + '(' + v + ' + ' + b + ')</strong>?',
    correct, [a + v + ' + ' + b, a + v + ' + ' + (b + a), (a + b) + v],
    'Distribute the ' + a + ': ' + a + ' × ' + v + ' + ' + a + ' × ' + b + ' = <strong>' + correct + '</strong>.');
}, 'Expand or factor to check whether two expressions are equivalent.');

S('expr', 'properties', 'Properties of operations', r => {
  const kind = RI(r, 1, 4);
  const a = RI(r, 2, 9), b = RI(r, 2, 9), c = RI(r, 2, 9);
  const cases = [
    ['Which property is shown? <strong>' + a + ' × ' + b + ' = ' + b + ' × ' + a + '</strong>', 'Commutative property of multiplication',
      ['Associative property of multiplication', 'Distributive property', 'Identity property of multiplication'],
      'Changing the order of the factors does not change the product.'],
    ['Which property is shown? <strong>(' + a + ' + ' + b + ') + ' + c + ' = ' + a + ' + (' + b + ' + ' + c + ')</strong>', 'Associative property of addition',
      ['Commutative property of addition', 'Distributive property', 'Identity property of addition'],
      'Changing the grouping of the addends does not change the sum.'],
    ['Which property is shown? <strong>' + a + ' × (' + b + ' + ' + c + ') = ' + (a * b) + ' + ' + (a * c) + '</strong>', 'Distributive property',
      ['Commutative property of multiplication', 'Associative property of addition', 'Identity property of multiplication'],
      'The factor outside is multiplied by each term inside the brackets.'],
    ['Which property is shown? <strong>' + a + ' + 0 = ' + a + '</strong>', 'Identity property of addition',
      ['Commutative property of addition', 'Associative property of addition', 'Zero property of multiplication'],
      'Adding 0 leaves a number unchanged.']
  ];
  const k = cases[kind - 1];
  return choiceQ(r, k[0], k[1], k[2], '<strong>' + k[1] + '.</strong> ' + k[3]);
}, 'Commutative → order changes; associative → grouping changes; distributive → multiply across brackets.');

/* ============================================================
   UNIT 11 — Equations & Inequalities
   ============================================================ */

S('equation', 'satisfy', 'Does x satisfy an equation?', r => {
  const x = RI(r, 2, 9), a = RI(r, 2, 7), b = RI(r, 1, 15);
  const truth = r() < 0.5;
  const c = truth ? a * x + b : a * x + b + RI(r, 1, 5);
  return choiceQ(r, 'Does <strong>x = ' + x + '</strong> satisfy <strong>' + a + 'x + ' + b + ' = ' + c + '</strong>?',
    truth ? 'Yes' : 'No', truth ? ['No'] : ['Yes'],
    'Substitute x = ' + x + ': ' + a + '(' + x + ') + ' + b + ' = ' + (a * x + b) + '.<br>' +
    (truth ? 'This equals ' + c + ', so it satisfies the equation.' : 'This does not equal ' + c + ', so it does not satisfy the equation.'));
}, 'Substitute the value for x and check whether both sides are equal.');

S('equation', 'solve-add', 'Solve one-step addition and subtraction equations', r => {
  const x = RI(r, 3, 25), a = RI(r, 3, 20);
  const add = r() < 0.5;
  const b = add ? x + a : x - a;
  const sign = add ? '+' : '−';
  const ans = add ? b - a : b + a;
  return {
    q: 'Solve for x: <strong>x ' + sign + ' ' + a + ' = ' + b + '</strong>',
    type: 'num', a: ans,
    sol: (add ? 'Subtract ' + a + ' from both sides' : 'Add ' + a + ' to both sides') + ':<br>' +
      'x = ' + b + (add ? ' − ' : ' + ') + a + ' = <strong>' + ans + '</strong>.'
  };
}, H.equation);

S('equation', 'solve-mult', 'Solve one-step multiplication and division equations', r => {
  const x = RI(r, 2, 12), a = RI(r, 2, 9);
  if (r() < 0.5) {
    return {
      q: 'Solve for x: <strong>' + a + 'x = ' + (a * x) + '</strong>',
      type: 'num', a: x,
      sol: 'Divide both sides by ' + a + ':<br>x = ' + (a * x) + ' ÷ ' + a + ' = <strong>' + x + '</strong>.'
    };
  }
  return {
    q: 'Solve for x: <strong>' + fh('x', a) + ' = ' + x + '</strong>',
    type: 'num', a: x * a,
    sol: 'Multiply both sides by ' + a + ':<br>x = ' + x + ' × ' + a + ' = <strong>' + (x * a) + '</strong>.'
  };
}, H.equation);

S('equation', 'solve-mixed', 'Solve one-step equations', r => {
  const x = RI(r, 2, 20);
  const kind = RI(r, 1, 4);
  if (kind === 1) {
    const a = RI(r, 2, 15);
    return { q: 'Solve for x: <strong>x + ' + a + ' = ' + (x + a) + '</strong>', type: 'num', a: x, sol: 'Subtract ' + a + ' from both sides: <strong>x = ' + x + '</strong>.' };
  }
  if (kind === 2) {
    const a = RI(r, 2, 12);
    return { q: 'Solve for x: <strong>x − ' + a + ' = ' + (x - a) + '</strong>', type: 'num', a: x, sol: 'Add ' + a + ' to both sides: <strong>x = ' + x + '</strong>.' };
  }
  if (kind === 3) {
    const a = RI(r, 2, 9);
    return { q: 'Solve for x: <strong>' + a + 'x = ' + (a * x) + '</strong>', type: 'num', a: x, sol: 'Divide both sides by ' + a + ': <strong>x = ' + x + '</strong>.' };
  }
  const a = RI(r, 2, 9);
  return { q: 'Solve for x: <strong>' + fh('x', a) + ' = ' + x + '</strong>', type: 'num', a: x * a, sol: 'Multiply both sides by ' + a + ': <strong>x = ' + (x * a) + '</strong>.' };
}, H.equation);

S('equation', 'word', 'Solve one-step equations: word problems', r => {
  const x = RI(r, 8, 45), a = RI(r, 3, 12);
  if (r() < 0.5) {
    return {
      q: 'After spending <strong>$' + a + '</strong>, Mia has <strong>$' + x + '</strong>. How much money did she start with?',
      type: 'num', a: x + a,
      sol: 'Let x be the starting amount. Then x − ' + a + ' = ' + x + '.<br>Add ' + a + ' to both sides: x = <strong>' + (x + a) + '</strong>.'
    };
  }
  return {
    q: '<strong>' + a + '</strong> friends share some stickers equally. Each friend gets <strong>' + x + '</strong> stickers. How many stickers are there?',
    type: 'num', a: a * x,
    sol: 'Let x be the number of stickers. Then x ÷ ' + a + ' = ' + x + '.<br>Multiply both sides by ' + a + ': x = <strong>' + (a * x) + '</strong>.'
  };
}, H.equation);

S('equation', 'write', 'Write an equation from words', r => {
  const x = RI(r, 3, 20), a = RI(r, 2, 15);
  const kind = RI(r, 1, 3);
  if (kind === 1) return choiceQ(r, 'Which equation represents “a number increased by ' + a + ' is ' + (x + a) + '”?',
    'x + ' + a + ' = ' + (x + a), ['x − ' + a + ' = ' + (x + a), a + 'x = ' + (x + a), 'x = ' + (x + a) + ' + ' + a],
    '“Increased by” means addition: <strong>x + ' + a + ' = ' + (x + a) + '</strong>.');
  if (kind === 2) return choiceQ(r, 'Which equation represents “' + a + ' times a number is ' + (a * x) + '”?',
    a + 'x = ' + (a * x), ['x + ' + a + ' = ' + (a * x), fh('x', a) + ' = ' + (a * x), a + ' + x = ' + (a * x)],
    '“Times” means multiplication: <strong>' + a + 'x = ' + (a * x) + '</strong>.');
  return choiceQ(r, 'Which equation represents “a number divided by ' + a + ' is ' + x + '”?',
    fh('x', a) + ' = ' + x, ['x × ' + a + ' = ' + x, 'x + ' + a + ' = ' + x, 'x − ' + a + ' = ' + x],
    '“Divided by” means division: <strong>' + fh('x', a) + ' = ' + x + '</strong>.');
}, 'Match the operation words to the symbols.');

S('equation', 'ineq-solution', 'Solutions to inequalities', r => {
  const a = RI(r, -10, 10), x = a + RI(r, -5, 5);
  const less = r() < 0.5;
  const truth = less ? x < a : x > a;
  return choiceQ(r, 'Is <strong>x = ' + x + '</strong> a solution of <strong>x ' + (less ? '<' : '>') + ' ' + a + '</strong>?',
    truth ? 'Yes' : 'No', truth ? ['No'] : ['Yes'],
    x + (less ? ' < ' : ' > ') + a + ' is ' + (truth ? 'true' : 'false') + ', so ' + (truth ? 'it is' : 'it is not') + ' a solution.');
}, 'Substitute the value and check whether the inequality is true.');

S('equation', 'ineq-graph', 'Graph inequalities on number lines', r => {
  const a = RI(r, -5, 5);
  const less = r() < 0.5;
  const open = r() < 0.5;
  const sym = open ? (less ? '<' : '>') : (less ? '≤' : '≥');
  const correct = 'x ' + sym + ' ' + a;
  const wrongs = ['x ' + (open ? (less ? '>' : '<') : (less ? '≥' : '≤')) + ' ' + a,
    'x ' + (open ? (less ? '≤' : '≥') : (less ? '<' : '>')) + ' ' + a,
    'x ' + sym + ' ' + (a + 1)];
  return choiceQ(r, 'Which inequality is shown on the number line?' +
    numberLineHTML(-8, 8, 1, [], { ray: { from: a, open: open, dir: less ? 'left' : 'right' } }),
    correct, wrongs,
    'The ray points ' + (less ? 'left, so x is less than ' : 'right, so x is greater than ') + a + '. ' +
    (open ? 'The open circle means the endpoint is not included: <strong>' + correct + '</strong>.'
      : 'The closed circle means the endpoint is included: <strong>' + correct + '</strong>.'));
}, 'Open circle → < or >; closed circle → ≤ or ≥.');

S('equation', 'ineq-solve', 'Solve one-step inequalities', r => {
  const k = RI(r, 3, 15), a = RI(r, 2, 12);
  const less = r() < 0.5;
  const rhs = less ? k + a : k - a;
  const correct = 'x ' + (less ? '<' : '>') + ' ' + k;
  return choiceQ(r, 'Solve <strong>x ' + (less ? '+' : '−') + ' ' + a + ' ' + (less ? '<' : '>') + ' ' + rhs + '</strong>.',
    correct,
    ['x ' + (less ? '>' : '<') + ' ' + k, 'x ' + (less ? '<' : '>') + ' ' + (k + a), 'x ' + (less ? '<' : '>') + ' ' + Math.abs(k - a)],
    (less ? 'Subtract ' + a + ' from both sides' : 'Add ' + a + ' to both sides') + '.<br>' +
    'x ' + (less ? '<' : '>') + ' ' + rhs + (less ? ' − ' : ' + ') + a + ' = <strong>' + k + '</strong>.');
}, H.equation);

S('equation', 'ineq-word', 'One-step inequalities: word problems', r => {
  const a = RI(r, 10, 30);
  return choiceQ(r, 'You must be at least <strong>' + a + '</strong> years old to join a club. Which inequality shows the allowed ages?',
    'x ≥ ' + a, ['x > ' + a, 'x ≤ ' + a, 'x < ' + a],
    '“At least ' + a + '” includes ' + a + ', so <strong>x ≥ ' + a + '</strong>.');
}, '“At least” means ≥; “at most” means ≤.');

S('equation', 'two-var-value', 'Find a value using two-variable equations', r => {
  const m = RI(r, 2, 6), b = RI(r, 1, 10), x = RI(r, 1, 9);
  return {
    q: 'Use the equation <strong>y = ' + m + 'x + ' + b + '</strong> to find y when <strong>x = ' + x + '</strong>.',
    type: 'num', a: m * x + b,
    sol: 'Substitute x = ' + x + ':<br>y = ' + m + '(' + x + ') + ' + b + ' = ' + (m * x) + ' + ' + b + ' = <strong>' + (m * x + b) + '</strong>.'
  };
}, 'Substitute the x-value, then calculate.');

S('equation', 'two-var-table', 'Complete a table for a two-variable relationship', r => {
  const m = RI(r, 2, 5), b = RI(r, 1, 8);
  const xs = [1, 2, 3, 4];
  const rows = xs.map(x => [String(x), String(m * x + b)]);
  const hidden = RI(r, 1, 3);
  rows[hidden] = [String(xs[hidden]), '?'];
  return {
    q: 'The table follows the rule <strong>y = ' + m + 'x + ' + b + '</strong>. What number is missing?' + tableHTML(['x', 'y'], rows),
    type: 'num', a: m * xs[hidden] + b,
    sol: 'Substitute x = ' + xs[hidden] + ': y = ' + m + '(' + xs[hidden] + ') + ' + b + ' = <strong>' + (m * xs[hidden] + b) + '</strong>.'
  };
}, 'Apply the rule to the missing x-value.');

S('equation', 'two-var-write', 'Write a two-variable equation', r => {
  const m = RI(r, 2, 5), b = RI(r, 1, 8);
  const rows = [1, 2, 3].map(x => [String(x), String(m * x + b)]);
  return choiceQ(r, 'Which equation matches the table?' + tableHTML(['x', 'y'], rows),
    'y = ' + m + 'x + ' + b,
    ['y = ' + m + 'x − ' + b, 'y = ' + b + 'x + ' + m, 'y = ' + (m + 1) + 'x + ' + b],
    'When x = 1, y = ' + (m + b) + '. The rule y = ' + m + 'x + ' + b + ' gives ' + m + '(1) + ' + b + ' = ' + (m + b) + ', and it fits every row.');
}, 'Test each equation with a row from the table.');


/* ============================================================
   Geometry & measurement diagrams (SVG)
   ============================================================ */

const DG = {
  stroke: '#374151',
  fill: '#eef3f8',
  accent: '#db3832',
  muted: '#6b7280',
  label: '#111827',
  dash: '#94a3b8'
};

function dgWrap(w, h, inner, label) {
  return '<svg class="qsvg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + label + '">' + inner + '</svg>';
}
function dgText(x, y, txt, opts) {
  opts = opts || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (opts.anchor || 'middle') + '" font-size="' + (opts.size || 15) + '" font-weight="' + (opts.weight || 700) + '" fill="' + (opts.fill || DG.label) + '">' + txt + '</text>';
}
function dgLine(x1, y1, x2, y2, opts) {
  opts = opts || {};
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (opts.stroke || DG.stroke) + '" stroke-width="' + (opts.width || 2.5) + '"' + (opts.dash ? ' stroke-dasharray="6 5"' : '') + '/>';
}
function dgPoly(points, opts) {
  opts = opts || {};
  return '<polygon points="' + points + '" fill="' + (opts.fill || DG.fill) + '" stroke="' + (opts.stroke || DG.stroke) + '" stroke-width="' + (opts.width || 2.5) + '"' + (opts.dash ? ' stroke-dasharray="6 5"' : '') + '/>';
}

/* ---------- angles ---------- */
function angleSVG(deg, label) {
  const W = 360, H = 230, vx = 180, vy = 185, L = 150, R = 45;
  const rad = deg * Math.PI / 180;
  const ex = vx + L * Math.cos(rad), ey = vy - L * Math.sin(rad);
  const ax = vx + R * Math.cos(rad), ay = vy - R * Math.sin(rad);
  const mx = vx + 76 * Math.cos(rad / 2), my = vy - 76 * Math.sin(rad / 2);
  let s = dgLine(vx, vy, vx + L, vy) + dgLine(vx, vy, ex, ey);
  s += '<path d="M ' + (vx + R) + ' ' + vy + ' A ' + R + ' ' + R + ' 0 0 0 ' + ax + ' ' + ay + '" fill="none" stroke="' + DG.accent + '" stroke-width="2.2"/>';
  s += '<circle cx="' + vx + '" cy="' + vy + '" r="4" fill="' + DG.stroke + '"/>';
  s += dgText(mx, my + 5, label, { fill: '#b32822', size: 17 });
  if (deg === 90) s += '<path d="M ' + (vx + 20) + ' ' + vy + ' L ' + (vx + 20) + ' ' + (vy - 20) + ' L ' + vx + ' ' + (vy - 20) + '" fill="none" stroke="' + DG.muted + '" stroke-width="1.5"/>';
  return dgWrap(W, H, s, 'Angle measuring ' + deg + ' degrees');
}

function complementSVG(a) {
  const W = 360, H = 240, vx = 80, vy = 200, L = 230;
  const rad = a * Math.PI / 180;
  const px = vx + L * Math.cos(rad), py = vy - L * Math.sin(rad);
  const kx = vx + 66 * Math.cos(rad / 2), ky = vy - 66 * Math.sin(rad / 2);
  const ux = vx + 66 * Math.cos((a + 90) / 2 * Math.PI / 180), uy = vy - 66 * Math.sin((a + 90) / 2 * Math.PI / 180);
  let s = dgLine(vx, vy, vx + L, vy) + dgLine(vx, vy, vx, vy - L) + dgLine(vx, vy, px, py, { width: 2 });
  s += '<path d="M ' + (vx + 45) + ' ' + vy + ' A 45 45 0 0 0 ' + (vx + 45 * Math.cos(rad)) + ' ' + (vy - 45 * Math.sin(rad)) + '" fill="none" stroke="' + DG.accent + '" stroke-width="2"/>';
  s += '<path d="M ' + (vx + 45 * Math.cos(rad)) + ' ' + (vy - 45 * Math.sin(rad)) + ' A 45 45 0 0 0 ' + vx + ' ' + (vy - 45) + '" fill="none" stroke="' + DG.muted + '" stroke-width="1.6" stroke-dasharray="5 4"/>';
  s += '<path d="M ' + (vx + 18) + ' ' + vy + ' L ' + (vx + 18) + ' ' + (vy - 18) + ' L ' + vx + ' ' + (vy - 18) + '" fill="none" stroke="' + DG.muted + '" stroke-width="1.5"/>';
  s += dgText(kx, ky + 5, a + '°', { fill: '#b32822', size: 16 });
  s += dgText(ux, uy + 5, '?', { fill: DG.muted, size: 18 });
  return dgWrap(W, H, s, 'Complementary angles, one measuring ' + a + ' degrees');
}

function supplementSVG(b) {
  const W = 360, H = 230, vx = 180, vy = 190, L = 150;
  const rad = b * Math.PI / 180;
  const px = vx + L * Math.cos(rad), py = vy - L * Math.sin(rad);
  const kx = vx + 70 * Math.cos(rad / 2), ky = vy - 70 * Math.sin(rad / 2);
  const ux = vx + 70 * Math.cos((b + 180) / 2 * Math.PI / 180), uy = vy - 70 * Math.sin((b + 180) / 2 * Math.PI / 180);
  let s = dgLine(20, vy, 340, vy) + dgLine(vx, vy, px, py, { width: 2 });
  s += '<path d="M ' + (vx + 50) + ' ' + vy + ' A 50 50 0 0 0 ' + (vx + 50 * Math.cos(rad)) + ' ' + (vy - 50 * Math.sin(rad)) + '" fill="none" stroke="' + DG.accent + '" stroke-width="2"/>';
  s += '<path d="M ' + (vx + 50 * Math.cos(rad)) + ' ' + (vy - 50 * Math.sin(rad)) + ' A 50 50 0 0 0 ' + (vx - 50) + ' ' + vy + '" fill="none" stroke="' + DG.muted + '" stroke-width="1.6" stroke-dasharray="5 4"/>';
  s += '<circle cx="' + vx + '" cy="' + vy + '" r="4" fill="' + DG.stroke + '"/>';
  s += dgText(kx, ky + 5, b + '°', { fill: '#b32822', size: 16 });
  s += dgText(ux, uy + 5, '?', { fill: DG.muted, size: 18 });
  return dgWrap(W, H, s, 'Supplementary angles, one measuring ' + b + ' degrees');
}

function verticalAnglesSVG(a, opposite) {
  const W = 360, H = 260, cx = 180, cy = 130, L = 125;
  const rad = a * Math.PI / 180;
  const x1 = cx - L * Math.cos(rad), y1 = cy + L * Math.sin(rad);
  const x2 = cx + L * Math.cos(rad), y2 = cy - L * Math.sin(rad);
  let s = dgLine(40, cy, 320, cy) + dgLine(x1, y1, x2, y2, { width: 2 });
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="' + DG.stroke + '"/>';
  const r1 = 52;
  const kx = cx + r1 * Math.cos(rad / 2), ky = cy - r1 * Math.sin(rad / 2);
  s += '<path d="M ' + (cx + r1) + ' ' + cy + ' A ' + r1 + ' ' + r1 + ' 0 0 0 ' + (cx + r1 * Math.cos(rad)) + ' ' + (cy - r1 * Math.sin(rad)) + '" fill="none" stroke="' + DG.accent + '" stroke-width="2"/>';
  s += dgText(kx, ky + 5, a + '°', { fill: '#b32822', size: 15 });
  let qx, qy, label;
  if (opposite) {
    qx = cx + r1 * Math.cos((a + 180) / 2 * Math.PI / 180) * 1.25;
    qy = cy - r1 * Math.sin((a + 180) / 2 * Math.PI / 180) * 1.25;
    label = '?';
  } else {
    qx = cx + r1 * Math.cos((a + 180) / 2 * Math.PI / 180) * 1.25;
    qy = cy - r1 * Math.sin((a + 180) / 2 * Math.PI / 180) * 1.25;
    label = '?';
  }
  s += dgText(qx, qy + 5, label, { fill: DG.muted, size: 18 });
  return dgWrap(W, H, s, 'Two intersecting lines with one angle of ' + a + ' degrees');
}

/* ---------- triangles and quadrilaterals ---------- */
function triangleSVG(opts) {
  const W = 360, H = 250;
  const angles = opts.angles || [60, 60, 60];
  const labels = opts.labels || [];
  const sideLabels = opts.sides || [];
  const A = Math.max(12, Math.min(90, angles[0]));
  const B = Math.max(12, Math.min(90, angles[1]));
  const C = 180 - A - B;
  const base = 240, lx = 60, rx = 300, by = 205;
  const t = base * Math.sin(B * Math.PI / 180) / Math.sin((A + B) * Math.PI / 180);
  const ax = lx + t * Math.cos(A * Math.PI / 180);
  const ay = by - t * Math.sin(A * Math.PI / 180);
  const P = [[lx, by], [rx, by], [ax, ay]];
  let s = dgPoly(P.map(p => p[0] + ',' + p[1]).join(' '));
  const cen = [(lx + rx + ax) / 3, (by + by + ay) / 3];
  if (labels.length) {
    P.forEach((p, i) => {
      if (!labels[i]) return;
      const dx = cen[0] - p[0], dy = cen[1] - p[1];
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      s += dgText(p[0] + dx / d * 27, p[1] + dy / d * 27 + 5, labels[i], { size: 15 });
    });
  }
  if (sideLabels.length) {
    const mids = [
      [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2],
      [(P[1][0] + P[2][0]) / 2, (P[1][1] + P[2][1]) / 2],
      [(P[2][0] + P[0][0]) / 2, (P[2][1] + P[0][1]) / 2]
    ];
    mids.forEach((m, i) => {
      if (!sideLabels[i]) return;
      const dx = m[0] - cen[0], dy = m[1] - cen[1];
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      s += dgText(m[0] + dx / d * 17, m[1] + dy / d * 17 + 5, sideLabels[i], { size: 13, fill: DG.muted });
    });
  }
  return dgWrap(W, H, s, opts.aria || 'Triangle diagram');
}

function quadAnglesSVG(labels) {
  const W = 360, H = 250;
  const P = [[70, 55], [300, 75], [275, 215], [85, 195]];
  let s = dgPoly(P.map(p => p[0] + ',' + p[1]).join(' '));
  const cen = [(70 + 300 + 275 + 85) / 4, (55 + 75 + 215 + 195) / 4];
  P.forEach((p, i) => {
    const dx = cen[0] - p[0], dy = cen[1] - p[1];
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    s += dgText(p[0] + dx / d * 30, p[1] + dy / d * 30 + 5, labels[i], { size: 15 });
  });
  return dgWrap(W, H, s, 'Quadrilateral with labelled angles');
}

function regularPolygonSVG(n, sideLabel) {
  const W = 360, H = 250, cx = 180, cy = 120, rad = 82;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push([cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)]);
  }
  let s = dgPoly(pts.map(p => p[0] + ',' + p[1]).join(' '));
  s += dgText(cx, 228, n + ' sides', { size: 13, fill: DG.muted, weight: 600 });
  if (sideLabel) {
    const p = pts[0], q = pts[1];
    s += dgText((p[0] + q[0]) / 2 + 18, (p[1] + q[1]) / 2, sideLabel, { size: 13, fill: DG.muted, anchor: 'start' });
  }
  return dgWrap(W, H, s, 'Regular polygon with ' + n + ' sides');
}

function shapeSVG(shape) {
  const W = 360, H = 250;
  let points = '';
  let label = shape;
  if (shape === 'square') points = '110,45 230,45 230,165 110,165';
  else if (shape === 'rectangle') points = '80,65 280,65 280,185 80,185';
  else if (shape === 'rhombus') points = '180,35 285,120 180,205 75,120';
  else if (shape === 'trapezoid') points = '85,185 275,185 230,65 130,65';
  else if (shape === 'parallelogram') points = '95,185 305,185 265,65 55,65';
  else if (shape === 'equilateral triangle') points = '180,40 280,200 80,200';
  else if (shape === 'isosceles triangle') points = '180,40 275,200 85,200';
  else {
    const n = shape === 'regular pentagon' ? 5 : shape === 'regular hexagon' ? 6 : 6;
    points = '';
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      points += (180 + 82 * Math.cos(ang)) + ',' + (120 + 82 * Math.sin(ang)) + ' ';
    }
  }
  let s = dgPoly(points.trim());
  return dgWrap(W, H, s, label);
}

/* ---------- solids ---------- */
function solidSVG(type, dims) {
  dims = dims || {};
  const W = 380, H = 280;
  let s = '';
  if (type === 'cube' || type === 'rect') {

    const sq = (x, y) => '<rect x="' + x + '" y="' + y + '" width="65" height="65" fill="#fdf2f0" stroke="#db3832" stroke-width="2"/>';
    s += sq(130, 60) + sq(195, 60) + sq(260, 60) + sq(130, 125) + sq(195, 125) + sq(195, 190);
  } else if (type === 'Triangular prism') {
    s += '<rect x="100" y="100" width="90" height="90" fill="#eef6fb" stroke="#2f6fb0" stroke-width="2"/>';
    s += '<rect x="190" y="100" width="90" height="90" fill="#eef6fb" stroke="#2f6fb0" stroke-width="2"/>';
    s += '<rect x="280" y="100" width="90" height="90" fill="#eef6fb" stroke="#2f6fb0" stroke-width="2"/>';
    s += gpoly([[100, 100], [145, 45], [190, 100]], '#fdf2f0', '#db3832', 2);
    s += gpoly([[100, 190], [145, 245], [190, 190]], '#fdf2f0', '#db3832', 2);
  } else if (type === 'Square pyramid') {
    s += '<rect x="175" y="115" width="90" height="90" fill="#fdf2f0" stroke="#db3832" stroke-width="2"/>';
    s += gpoly([[175, 115], [220, 50], [265, 115]], '#eef6fb', '#2f6fb0', 2);
    s += gpoly([[175, 205], [220, 270], [265, 205]], '#eef6fb', '#2f6fb0', 2);
    s += gpoly([[175, 115], [110, 160], [175, 205]], '#eef6fb', '#2f6fb0', 2);
    s += gpoly([[265, 115], [330, 160], [265, 205]], '#eef6fb', '#2f6fb0', 2);
  } else {
    s += '<rect x="85" y="110" width="80" height="80" fill="#eef6fb" stroke="#2f6fb0" stroke-width="2"/>';
    s += '<rect x="165" y="110" width="120" height="80" fill="#fdf2f0" stroke="#db3832" stroke-width="2"/>';
    s += '<rect x="285" y="110" width="80" height="80" fill="#eef6fb" stroke="#2f6fb0" stroke-width="2"/>';
    s += '<rect x="165" y="190" width="120" height="80" fill="#fdf2f0" stroke="#db3832" stroke-width="2"/>';
  }
  return geoWrap(s, '0 0 470 330', 'Net of a ' + type.toLowerCase());
}

/* ---------- measurement ---------- */
function svgRectShape(l, w, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  let s = gpoly([[80, 80], [360, 80], [360, 240], [80, 240]]);
  s += gt(220, 65, l + ' ' + u);
  s += gt(385, 165, w + ' ' + u, { anchor: 'start' });
  if (opts.missing) s += gt(220, 165, opts.missing, { size: 16 });
  return geoWrap(s, '0 0 440 300', 'Rectangle with dimensions');
}
function svgParallelogramShape(b, h, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  let s = gpoly([[70, 240], [340, 240], [390, 80], [120, 80]]);
  s += gdash(120, 80, 120, 240);
  s += gt(205, 265, b + ' ' + u) + gt(105, 165, h + ' ' + u, { anchor: 'end' });
  return geoWrap(s, '0 0 440 300', 'Parallelogram with base and height');
}
function svgTriangleShape(b, h, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  let s = gpoly([[70, 245], [380, 245], [200, 65]]);
  s += gdash(200, 65, 200, 245);
  s += gt(225, 270, b + ' ' + u) + gt(215, 160, h + ' ' + u, { anchor: 'start' });
  return geoWrap(s, '0 0 440 300', 'Triangle with base and height');
}
function svgTrapezoidShape(a, b, h, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  let s = gpoly([[140, 85], [310, 85], [390, 245], [55, 245]]);
  s += gdash(140, 85, 140, 245);
  s += gt(225, 70, a + ' ' + u) + gt(225, 270, b + ' ' + u) + gt(122, 165, h + ' ' + u, { anchor: 'end' });
  return geoWrap(s, '0 0 440 300', 'Trapezoid with parallel sides and height');
}
function svgCompoundShape(W, H, w, h, opts) {
  opts = opts || {};
  const u = opts.unit || 'm';
  const pts = [[60, 60], [220, 60], [220, 160], [340, 160], [340, 260], [60, 260]];
  let s = gpoly(pts);
  s += gt(200, 285, W + ' ' + u) + gt(42, 165, H + ' ' + u, { anchor: 'end' });
  s += gt(280, 148, w + ' ' + u) + gt(358, 210, h + ' ' + u, { anchor: 'start' });
  return geoWrap(s, '0 0 440 310', 'L-shaped compound figure');
}
function svgPrismShape(l, w, h, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  const x = 90, y = 110, W = 160, H = 110, dx = 60, dy = -45;
  let s = gpoly([[x, y], [x + W, y], [x + W, y + H], [x, y + H]]);
  s += gpoly([[x + dx, y + dy], [x + W + dx, y + dy], [x + W + dx, y + H + dy], [x + dx, y + H + dy]], 'none', '#374151', 1.6);
  s += gl(x, y, x + dx, y + dy, '#374151', 1.6) + gl(x + W, y, x + W + dx, y + dy, '#374151', 1.6);
  s += gl(x + W, y + H, x + W + dx, y + H + dy, '#374151', 1.6) + gl(x, y + H, x + dx, y + H + dy, '#374151', 1.6);
  s += gt(x + W / 2, y - 12, l + ' ' + u) + gt(x + W + 66, y + H / 2 + 5, w + ' ' + u, { anchor: 'start' }) + gt(x + dx + 10, y + dy + H / 2, h + ' ' + u, { anchor: 'end' });
  if (opts.label) s += gt(235, 300, opts.label, { size: 13, fill: '#6b7280' });
  return geoWrap(s, '0 0 470 330', 'Rectangular prism with dimensions');
}
function svgTriPrismShape(a, b, L, opts) {
  opts = opts || {};
  const u = opts.unit || 'cm';
  const A = [70, 245], B = [260, 245], C = [130, 100], dx = 75, dy = -35;
  let s = gpoly([A, B, C]);
  s += gpoly([[A[0] + dx, A[1] + dy], [B[0] + dx, B[1] + dy], [C[0] + dx, C[1] + dy]], 'none', '#374151', 1.6);
  s += gl(A[0], A[1], A[0] + dx, A[1] + dy, '#374151', 1.6) + gl(B[0], B[1], B[0] + dx, B[1] + dy, '#374151', 1.6) + gl(C[0], C[1], C[0] + dx, C[1] + dy, '#374151', 1.6);
  s += gt(160, 270, a + ' ' + u) + gt(285, 200, b + ' ' + u) + gt(245, 80, L + ' ' + u);
  if (opts.label) s += gt(235, 305, opts.label, { size: 13, fill: '#6b7280' });
  return geoWrap(s, '0 0 470 330', 'Triangular prism with dimensions');
}

S('geometry', 'angle-classify', 'Measure and classify angles', r => {
  const angle = pick(r, [15, 25, 35, 45, 55, 65, 75, 90, 100, 110, 125, 135, 150, 165, 180]);
  const type = angle < 90 ? 'Acute' : angle === 90 ? 'Right' : angle < 180 ? 'Obtuse' : 'Straight';
  return choiceQ(r, 'Classify an angle that measures <strong>' + angle + '°</strong>.' + svgAngleDiagram(angle, angle + '°'), type,
    ['Acute', 'Right', 'Obtuse', 'Straight'].filter(x => x !== type),
    angle + '° is ' + (angle < 90 ? 'less than 90°' : angle === 90 ? 'exactly 90°' : angle < 180 ? 'between 90° and 180°' : 'exactly 180°') + ', so it is <strong>' + type.toLowerCase() + '</strong>.');
}, 'Acute < 90°, right = 90°, obtuse between 90° and 180°, straight = 180°.');

S('geometry', 'angle-complement', 'Complementary and supplementary angles', r => {
  const a = RI(r, 10, 80);
  const kind = RI(r, 1, 2);
  if (kind === 1) return {
    q: 'What is the complement of an angle measuring <strong>' + a + '°</strong>?' + svgComplement(a),
    type: 'num', a: 90 - a, unit: '°',
    sol: 'Complementary angles add to 90°:<br>90° − ' + a + '° = <strong>' + (90 - a) + '°</strong>.'
  };
  const b = RI(r, 30, 150);
  return {
    q: 'What is the supplement of an angle measuring <strong>' + b + '°</strong>?' + svgSupplement(b),
    type: 'num', a: 180 - b, unit: '°',
    sol: 'Supplementary angles add to 180°:<br>180° − ' + b + '° = <strong>' + (180 - b) + '°</strong>.'
  };
}, 'Complement sums to 90°; supplement sums to 180°.');

S('geometry', 'angle-vertical', 'Vertical and adjacent angles', r => {
  const a = RI(r, 25, 155);
  if (r() < 0.5) return {
    q: 'Two straight lines cross. One angle is <strong>' + a + '°</strong>. What is the measure of the vertically opposite angle?' + svgIntersecting(a, 'vertical'),
    type: 'num', a: a, unit: '°',
    sol: 'Vertical angles are equal, so the opposite angle is also <strong>' + a + '°</strong>.'
  };
  return {
    q: 'Two straight lines cross. One angle is <strong>' + a + '°</strong>. What is the measure of an adjacent angle?' + svgIntersecting(a, 'adjacent'),
    type: 'num', a: 180 - a, unit: '°',
    sol: 'Adjacent angles on a straight line add to 180°:<br>180° − ' + a + '° = <strong>' + (180 - a) + '°</strong>.'
  };
}, 'Vertical angles are equal; adjacent angles on a line add to 180°.');

S('geometry', 'triangle-angle', 'Find missing angles in triangles', r => {
  const a = RI(r, 30, 70), b = RI(r, 30, 70);
  const c = 180 - a - b;
  return {
    q: 'Two angles of a triangle measure <strong>' + a + '°</strong> and <strong>' + b + '°</strong>. What is the third angle?' + svgTriangleAngles([a + '°', b + '°', '?']),
    type: 'num', a: c, unit: '°',
    sol: 'The angles in a triangle add to 180°.<br>180° − ' + a + '° − ' + b + '° = <strong>' + c + '°</strong>.'
  };
}, 'The angles in any triangle add to 180°.');

S('geometry', 'quad-angle', 'Find missing angles in quadrilaterals', r => {
  const a = RI(r, 60, 100), b = RI(r, 60, 100), c = RI(r, 60, 100);
  const d = 360 - a - b - c;
  return {
    q: 'Three angles of a quadrilateral measure <strong>' + a + '°</strong>, <strong>' + b + '°</strong> and <strong>' + c + '°</strong>. What is the fourth angle?' + svgQuadAngles([a + '°', b + '°', c + '°', '?']),
    type: 'num', a: d, unit: '°',
    sol: 'The angles in a quadrilateral add to 360°.<br>360° − ' + a + '° − ' + b + '° − ' + c + '° = <strong>' + d + '°</strong>.'
  };
}, 'The angles in a quadrilateral add to 360°.');

S('geometry', 'polygon-angle', 'Sums of angles in polygons', r => {
  const n = RI(r, 5, 10);
  const sum = (n - 2) * 180;
  return {
    q: 'What is the sum of the interior angles of a polygon with <strong>' + n + ' sides</strong>?' + svgPolygon(n, n + ' sides'),
    type: 'num', a: sum, unit: '°',
    sol: 'Use (n − 2) × 180° with n = ' + n + ':<br>(' + n + ' − 2) × 180° = ' + (n - 2) + ' × 180° = <strong>' + sum + '°</strong>.'
  };
}, 'Angle sum = (number of sides − 2) × 180°.');

S('geometry', 'triangle-classify', 'Classify triangles', r => {
  if (r() < 0.5) {
    const kind = RI(r, 1, 3);
    if (kind === 1) return choiceQ(r, 'A triangle has angles <strong>60°, 60°, 60°</strong>. Classify it by its angles.' + svgTriangleAngles(['60°', '60°', '60°']), 'Equilateral',
      ['Isosceles', 'Scalene', 'Right'], 'All three angles are equal, so all three sides are equal: an equilateral triangle.');
    if (kind === 2) return choiceQ(r, 'A triangle has angles <strong>40°, 70°, 70°</strong>. Classify it by its angles.' + svgTriangleAngles(['40°', '70°', '70°']), 'Isosceles',
      ['Equilateral', 'Scalene', 'Right'], 'Two angles are equal, so two sides are equal: an isosceles triangle.');
    return choiceQ(r, 'A triangle has angles <strong>35°, 65°, 80°</strong>. Classify it by its angles.' + svgTriangleAngles(['35°', '65°', '80°']), 'Scalene',
      ['Equilateral', 'Isosceles', 'Right'], 'All three angles are different, so all three sides are different: a scalene triangle.');
  }
  const kind = RI(r, 1, 3);
  if (kind === 1) return choiceQ(r, 'A triangle has sides <strong>5 cm, 5 cm, 5 cm</strong>. Classify it by its sides.' + svgTriangleSides(['5 cm', '5 cm', '5 cm']), 'Equilateral',
    ['Isosceles', 'Scalene', 'Right'], 'All three sides are equal, so it is equilateral.');
  if (kind === 2) return choiceQ(r, 'A triangle has sides <strong>6 cm, 6 cm, 9 cm</strong>. Classify it by its sides.' + svgTriangleSides(['6 cm', '6 cm', '9 cm']), 'Isosceles',
    ['Equilateral', 'Scalene', 'Right'], 'Two sides are equal, so it is isosceles.');
  return choiceQ(r, 'A triangle has sides <strong>4 cm, 7 cm, 9 cm</strong>. Classify it by its sides.' + svgTriangleSides(['4 cm', '7 cm', '9 cm']), 'Scalene',
    ['Equilateral', 'Isosceles', 'Right'], 'All three sides are different, so it is scalene.');
}, 'Equilateral = all equal, isosceles = two equal, scalene = all different.');

S('geometry', 'triangle-inequality', 'Triangle inequality', r => {
  const a = RI(r, 2, 8), b = RI(r, 3, 9);
  const c = a + b - RI(r, 1, 3);
  const correct = [a, b, c].sort((x, y) => x - y).join(', ');
  const wrongs = [];
  let guard = 0;
  while (wrongs.length < 3 && guard++ < 100) {
    const p = RI(r, 1, 5), q = RI(r, 2, 6);
    const rr = p + q + RI(r, 0, 4);
    const w = [p, q, rr].sort((x, y) => x - y).join(', ');
    if (w !== correct && wrongs.indexOf(w) === -1 && p + q <= rr) wrongs.push(w);
  }
  return choiceQ(r, 'Which set of side lengths can form a triangle?' + svgTriangleSides(['a', 'b', 'c']), correct, wrongs,
    'For a triangle, the sum of the two shorter sides must be greater than the longest side.<br>' +
    correct + ': ' + (a + b > c ? 'the two shorter sides add to more than ' + Math.max(a, b, c) + '. ✓' : '') + 
    '<br>The other sets fail this test.');
}, 'The two shorter sides must add to more than the longest side.');

S('geometry', 'quad-classify', 'Classify quadrilaterals', r => {
  const items = [
    ['four right angles and all sides equal', 'Square', ['Rectangle', 'Rhombus', 'Trapezoid']],
    ['four right angles but not all sides equal', 'Rectangle', ['Square', 'Rhombus', 'Trapezoid']],
    ['all sides equal but no right angles', 'Rhombus', ['Square', 'Rectangle', 'Trapezoid']],
    ['exactly one pair of parallel sides', 'Trapezoid', ['Parallelogram', 'Rectangle', 'Square']],
    ['both pairs of opposite sides parallel and equal, adjacent sides not equal, and no right angles', 'Parallelogram', ['Trapezoid', 'Square', 'Rectangle']]
  ];
  const it = pick(r, items);
  return choiceQ(r, 'Which quadrilateral has <strong>' + it[0] + '</strong>?' + svgQuadFamily(), it[1], it[2],
    'A shape with ' + it[0] + ' is a <strong>' + it[1].toLowerCase() + '</strong>.');
}, 'Use the parallel sides and right angles to identify the shape.');

S('geometry', 'symmetry', 'Line symmetry', r => {
  const shapes = [
    ['square', 4], ['rectangle (not a square)', 2], ['equilateral triangle', 3],
    ['regular pentagon', 5], ['regular hexagon', 6], ['isosceles triangle', 1]
  ];
  const s = pick(r, shapes);
  const symShape = s[0] === 'rectangle (not a square)' ? 'rectangle' : s[0];
  return {
    q: 'How many lines of symmetry does a <strong>' + s[0] + '</strong> have?' + svgSymmetry(symShape),
    type: 'num', a: s[1],
    sol: 'A ' + s[0] + ' has <strong>' + s[1] + '</strong> line' + (s[1] === 1 ? '' : 's') + ' of symmetry.'
  };
}, 'A line of symmetry folds the shape onto itself exactly.');

S('geometry', 'polyhedra', 'Identify polyhedra', r => {
  const solids = [
    ['cube', 6, 12, 8], ['rectangular prism', 6, 12, 8], ['triangular prism', 5, 9, 6],
    ['square pyramid', 5, 8, 5], ['triangular pyramid', 4, 6, 4]
  ];
  const s = pick(r, solids);
  const kind = RI(r, 1, 3);
  if (kind === 1) return { q: 'How many <strong>faces</strong> does a <strong>' + s[0] + '</strong> have?' + svgSolid(s[0]), type: 'num', a: s[1], sol: 'A ' + s[0] + ' has <strong>' + s[1] + ' faces</strong>.' };
  if (kind === 2) return { q: 'How many <strong>edges</strong> does a <strong>' + s[0] + '</strong> have?' + svgSolid(s[0]), type: 'num', a: s[2], sol: 'A ' + s[0] + ' has <strong>' + s[2] + ' edges</strong>.' };
  return { q: 'How many <strong>vertices</strong> does a <strong>' + s[0] + '</strong> have?' + svgSolid(s[0]), type: 'num', a: s[3], sol: 'A ' + s[0] + ' has <strong>' + s[3] + ' vertices</strong>.' };
}, 'Faces are flat surfaces, edges are where faces meet, vertices are corners.');

S('geometry', 'nets', 'Nets of three-dimensional figures', r => {
  const items = [
    ['six congruent squares', 'Cube', ['Triangular prism', 'Square pyramid', 'Cylinder']],
    ['two triangles and three rectangles', 'Triangular prism', ['Cube', 'Square pyramid', 'Rectangular prism']],
    ['one square and four triangles', 'Square pyramid', ['Cube', 'Triangular prism', 'Cylinder']],
    ['six rectangles, with opposite faces equal', 'Rectangular prism', ['Cube', 'Square pyramid', 'Triangular prism']]
  ];
  const it = pick(r, items);
  return choiceQ(r, 'A net is made of <strong>' + it[0] + '</strong>. Which solid does it fold into?' + svgNet(it[1]), it[1], it[2],
    'The faces match the surface of a <strong>' + it[1].toLowerCase() + '</strong>.');
}, 'Count the shapes in the net and match them to the solid’s faces.');

S('measure', 'perimeter', 'Perimeter', r => {
  if (r() < 0.5) {
    const l = RI(r, 4, 20), w = RI(r, 2, 15);
    return {
      q: 'Find the perimeter of a rectangle with length <strong>' + l + ' cm</strong> and width <strong>' + w + ' cm</strong>.' + svgRectShape(l, w),
      type: 'num', a: 2 * (l + w), unit: 'cm',
      sol: 'P = 2(l + w) = 2(' + l + ' + ' + w + ') = <strong>' + (2 * (l + w)) + ' cm</strong>.'
    };
  }
  const n = RI(r, 3, 8), s = RI(r, 3, 12);
  return {
    q: 'Find the perimeter of a regular polygon with <strong>' + n + ' sides</strong>, each <strong>' + s + ' cm</strong> long.' + svgPolygon(n, 'each side ' + s + ' cm'),
    type: 'num', a: n * s, unit: 'cm',
    sol: 'Perimeter = number of sides × side length = ' + n + ' × ' + s + ' = <strong>' + (n * s) + ' cm</strong>.'
  };
}, 'Perimeter is the distance around the outside.');

S('measure', 'area-rect', 'Area of rectangles and squares', r => {
  const l = RI(r, 4, 20), w = RI(r, 3, 15);
  return {
    q: 'Find the area of a rectangle with length <strong>' + l + ' cm</strong> and width <strong>' + w + ' cm</strong>.' + svgRectShape(l, w),
    type: 'num', a: l * w, unit: 'cm²',
    sol: 'A = length × width = ' + l + ' × ' + w + ' = <strong>' + (l * w) + ' cm²</strong>.'
  };
}, 'Area of a rectangle = length × width.');

S('measure', 'area-parallelogram', 'Area of parallelograms', r => {
  const b = RI(r, 4, 18), h = RI(r, 3, 12);
  return {
    q: 'Find the area of a parallelogram with base <strong>' + b + ' cm</strong> and height <strong>' + h + ' cm</strong>.' + svgParallelogramShape(b, h),
    type: 'num', a: b * h, unit: 'cm²',
    sol: 'A = base × height = ' + b + ' × ' + h + ' = <strong>' + (b * h) + ' cm²</strong>.'
  };
}, 'Area of a parallelogram = base × perpendicular height.');

S('measure', 'area-triangle', 'Area of triangles', r => {
  const b = RI(r, 4, 18), h = RI(r, 3, 14);
  const area = b * h / 2;
  return {
    q: 'Find the area of a triangle with base <strong>' + b + ' cm</strong> and height <strong>' + h + ' cm</strong>.' + svgTriangleShape(b, h),
    type: 'num', a: area, unit: 'cm²',
    sol: 'A = ½ × base × height = ½ × ' + b + ' × ' + h + ' = <strong>' + plain(area, 1) + ' cm²</strong>.'
  };
}, 'Area of a triangle = ½ × base × height.');

S('measure', 'area-trapezoid', 'Area of trapezoids', r => {
  const a = RI(r, 3, 10), b = a + RI(r, 2, 8), h = RI(r, 3, 10);
  const area = (a + b) * h / 2;
  return {
    q: 'Find the area of a trapezoid with parallel sides <strong>' + a + ' cm</strong> and <strong>' + b + ' cm</strong>, and height <strong>' + h + ' cm</strong>.' + svgTrapezoidShape(a, b, h),
    type: 'num', a: area, unit: 'cm²',
    sol: 'A = ½(a + b)h = ½(' + a + ' + ' + b + ') × ' + h + ' = ½ × ' + (a + b) + ' × ' + h + ' = <strong>' + plain(area, 1) + ' cm²</strong>.'
  };
}, 'Area of a trapezoid = ½ × (sum of parallel sides) × height.');

S('measure', 'area-compound', 'Area of compound figures', r => {
  const W = RI(r, 8, 16), H = RI(r, 8, 14), w = RI(r, 3, 6), h = RI(r, 2, 5);
  const area = W * H - w * h;
  return {
    q: 'An L-shaped room is <strong>' + W + ' m</strong> by <strong>' + H + ' m</strong>, with a <strong>' + w + ' m</strong> by <strong>' + h + ' m</strong> rectangular corner removed. What is the area of the room?' + svgCompoundShape(W, H, w, h, { unit: 'm' }),
    type: 'num', a: area, unit: 'm²',
    sol: 'Large rectangle: ' + W + ' × ' + H + ' = ' + (W * H) + ' m².<br>' +
      'Corner removed: ' + w + ' × ' + h + ' = ' + (w * h) + ' m².<br>' +
      'Area = ' + (W * H) + ' − ' + (w * h) + ' = <strong>' + area + ' m²</strong>.'
  };
}, 'Split the shape into rectangles, or subtract the missing corner.');

S('measure', 'area-missing', 'Find a missing side length', r => {
  const l = RI(r, 4, 15), w = RI(r, 3, 12);
  return {
    q: 'A rectangle has area <strong>' + (l * w) + ' cm²</strong> and length <strong>' + l + ' cm</strong>. What is its width?' + svgRectShape(l, '?'),
    type: 'num', a: w, unit: 'cm',
    sol: 'A = l × w, so w = A ÷ l.<br>' + (l * w) + ' ÷ ' + l + ' = <strong>' + w + ' cm</strong>.'
  };
}, 'Divide the area by the known side.');

S('measure', 'volume-prism', 'Volume of cubes and rectangular prisms', r => {
  const l = RI(r, 3, 12), w = RI(r, 2, 10), h = RI(r, 2, 9);
  return {
    q: 'Find the volume of a rectangular prism with length <strong>' + l + ' cm</strong>, width <strong>' + w + ' cm</strong> and height <strong>' + h + ' cm</strong>.' + svgPrismShape(l, w, h),
    type: 'num', a: l * w * h, unit: 'cm³',
    sol: 'V = l × w × h = ' + l + ' × ' + w + ' × ' + h + ' = <strong>' + (l * w * h) + ' cm³</strong>.'
  };

S('measure', 'surface-rect', 'Surface area of rectangular prisms', r => {
  const l = RI(r, 3, 10), w = RI(r, 2, 8), h = RI(r, 2, 7);

    q: 'Find the surface area of a rectangular prism with length <strong>' + l + ' cm</strong>, width <strong>' + w + ' cm</strong> and height <strong>' + h + ' cm</strong>.' + svgPrismShape(l, w, h, { label: 'Surface area' }),
    type: 'num', a: sa, unit: 'cm²',
    sol: 'SA = 2(lw + lh + wh)<br>= 2(' + (l * w) + ' + ' + (l * h) + ' + ' + (w * h) + ')<br>= 2(' + (l * w + l * h + w * h) + ') = <strong>' + sa + ' cm²</strong>.'

S('measure', 'volume-tri-prism', 'Volume of triangular prisms', r => {
  const a = RI(r, 3, 8), b = RI(r, 4, 10), L = RI(r, 5, 12);
  const vol = a * b / 2 * L;
  return {
    q: 'A triangular prism has a right-triangle base with legs <strong>' + a + ' cm</strong> and <strong>' + b + ' cm</strong>, and length <strong>' + L + ' cm</strong>. Find its volume.' + svgTriPrismShape(a, b, L),
    type: 'num', a: vol, unit: 'cm³',
    sol: 'Area of base = ½ × ' + a + ' × ' + b + ' = ' + plain(a * b / 2, 1) + ' cm².<br>' +
      'V = base area × length = ' + plain(a * b / 2, 1) + ' × ' + L + ' = <strong>' + plain(vol, 1) + ' cm³</strong>.'
  };
}, 'Volume of a prism = area of the base × length.');

S('measure', 'surface-tri-prism', 'Surface area of triangular prisms', r => {
  const k = RI(r, 1, 3);
  const a = 3 * k, b = 4 * k, c = 5 * k, L = RI(r, 4, 10);
  const B = a * b / 2, P = a + b + c;
  const sa = 2 * B + P * L;

    q: 'A triangular prism has a 3-4-5 right-triangle base with legs <strong>' + a + ' cm</strong> and <strong>' + b + ' cm</strong>, hypotenuse <strong>' + c + ' cm</strong>, and length <strong>' + L + ' cm</strong>. Find its surface area.' + svgTriPrismShape(a, b, L, { label: 'Surface area' }),
    type: 'num', a: sa, unit: 'cm²',
    sol: 'Base area B = ½ × ' + a + ' × ' + b + ' = ' + plain(B, 1) + ' cm².<br>' +
      'Perimeter P = ' + a + ' + ' + b + ' + ' + c + ' = ' + P + ' cm.<br>' +
      'SA = 2B + PL = 2(' + plain(B, 1) + ') + ' + P + ' × ' + L + ' = <strong>' + plain(sa, 1) + ' cm²</strong>.'
  };
}, 'Surface area = 2 × base area + perimeter of base × length.');

S('measure', 'word', 'Perimeter, area and volume: word problems', r => {
  if (r() < 0.5) {
    const l = RI(r, 4, 12), w = RI(r, 3, 9), h = RI(r, 2, 6);

function medianOf(arr) {
  const a = arr.slice().sort((x, y) => x - y);
  const n = a.length;
  return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
}
function modeOf(arr) {
  const c = {};
  arr.forEach(v => { c[v] = (c[v] || 0) + 1; });
  let best = null, bestN = 0;
  Object.keys(c).forEach(k => { if (c[k] > bestN) { bestN = c[k]; best = Number(k); } });
  return best;
}
function pieChartHTML(items) {
  let acc = 0;
  const stops = items.map(it => {
    const start = acc;
    acc += it.value;
    return it.color + ' ' + start + '% ' + acc + '%';
  }).join(', ');
  let legend = '<div class="pie-legend">';
  items.forEach(it => {
    legend += '<span><i style="background:' + it.color + '"></i>' + it.label + ' — ' + it.value + '%</span>';
  });
  legend += '</div>';
  return '<div class="pie-row"><div class="pie" style="background:conic-gradient(' + stops + ')"></div>' + legend + '</div>';
}

S('data', 'center', 'Mean, median, mode and range', r => {
  const m = RI(r, 4, 12);
  const vals = shuffle(r, [m, m, m - 1, m + 1, m + 2, m - 2]);
  const mean = m, median = m, mode = m, range = 4;
  const kind = RI(r, 1, 4);
  const label = kind === 1 ? 'mean' : kind === 2 ? 'median' : kind === 3 ? 'mode' : 'range';
  const ans = kind === 1 ? mean : kind === 2 ? median : kind === 3 ? mode : range;
  return {
    q: 'Find the <strong>' + label + '</strong> of the data set:<br><span class="datalist">' + vals.join(', ') + '</span>',
    type: 'num', a: ans,
    sol: 'Order the data: ' + vals.slice().sort((a, b) => a - b).join(', ') + '.<br>' +
      (kind === 1 ? 'Mean = sum ÷ 6 = ' + (m * 6) + ' ÷ 6 = <strong>' + mean + '</strong>.'
        : kind === 2 ? 'With 6 values, the median is the mean of the 3rd and 4th values: <strong>' + median + '</strong>.'
        : kind === 3 ? 'The value that appears most often is <strong>' + mode + '</strong>.'
        : 'Range = greatest − least = ' + (m + 2) + ' − ' + (m - 2) + ' = <strong>4</strong>.')
  };
}, 'Mean = sum ÷ count; median = middle; mode = most frequent; range = greatest − least.');

S('data', 'dot-plot', 'Interpret dot plots', r => {
  const base = [1, 2, 3, 4, 5, 6, 7];
  const mode = RI(r, 2, 6);
  const vals = [mode, mode, mode, mode - 1, mode + 1, mode + 2, mode - 2, 1, 7].sort((a, b) => a - b);
  const kind = RI(r, 1, 3);
  const med = medianOf(vals), rng = Math.max(...vals) - Math.min(...vals);
  const label = kind === 1 ? 'mode' : kind === 2 ? 'median' : 'range';
  const ans = kind === 1 ? modeOf(vals) : kind === 2 ? med : rng;
  return {
    q: 'The dot plot shows the number of books read by students. Find the <strong>' + label + '</strong>.' + dotPlotHTML(vals, 'books'),
    type: 'num', a: ans,
    sol: (kind === 1 ? 'The tallest stack is above <strong>' + ans + '</strong>, so that is the mode.'
      : kind === 2 ? 'There are ' + vals.length + ' values. The middle value is <strong>' + ans + '</strong>.'
      : 'Greatest = ' + Math.max(...vals) + ', least = ' + Math.min(...vals) + ', so range = <strong>' + ans + '</strong>.')
  };
}, 'Read the values from the dot plot, then calculate.');

S('data', 'mad', 'Mean absolute deviation', r => {
  const m = RI(r, 5, 15);
  const vals = [m - 3, m - 1, m + 1, m + 3];
  return {
    q: 'Find the mean absolute deviation of the data set:<br><span class="datalist">' + vals.join(', ') + '</span>',
    type: 'num', a: 2,
    sol: 'Mean = (' + vals.join(' + ') + ') ÷ 4 = ' + m + '.<br>' +
      'Deviations: |' + (m - 3) + ' − ' + m + '| = 3, |' + (m - 1) + ' − ' + m + '| = 1, |' + (m + 1) + ' − ' + m + '| = 1, |' + (m + 3) + ' − ' + m + '| = 3.<br>' +
      'MAD = (3 + 1 + 1 + 3) ÷ 4 = <strong>2</strong>.'
  };
}, 'Find the mean, then average the distances from the mean.');

S('data', 'quartiles', 'Quartiles and interquartile range', r => {
  const a = RI(r, 2, 5);
  const mid = a + 6;
  const b = mid + 3;
  const vals = [a, a + 1, a + 2, a + 3, a + 4, mid, b, b + 1, b + 2, b + 3, b + 4];
  const q1 = a + 2, q3 = b + 2;
  const kind = RI(r, 1, 3);
  const label = kind === 1 ? 'first quartile (Q1)' : kind === 2 ? 'third quartile (Q3)' : 'interquartile range (IQR)';
  const ans = kind === 1 ? q1 : kind === 2 ? q3 : q3 - q1;
  return {
    q: 'Find the <strong>' + label + '</strong> of the data set:<br><span class="datalist">' + vals.join(', ') + '</span>',
    type: 'num', a: ans,
    sol: 'The median is ' + mid + '. The lower half is ' + vals.slice(0, 5).join(', ') + ', so Q1 = ' + q1 + '.<br>' +
      'The upper half is ' + vals.slice(6).join(', ') + ', so Q3 = ' + q3 + '.<br>' +
      'IQR = Q3 − Q1 = ' + q3 + ' − ' + q1 + ' = <strong>' + (q3 - q1) + '</strong>.'
  };
}, 'Q1 and Q3 are the medians of the lower and upper halves.');

S('data', 'outlier', 'Identify an outlier', r => {
  const base = 10, vals = [];
  for (let i = 0; i < 6; i++) vals.push(base + RI(r, -3, 3));
  vals.push(base + RI(r, 20, 35));
  const out = Math.max(...vals);
  return {
    q: 'Which value is an outlier in the data set?<br><span class="datalist">' + shuffle(r, vals).join(', ') + '</span>',
    type: 'num', a: out,
    sol: 'Most values are close to ' + base + '. The value <strong>' + out + '</strong> is far away from the rest, so it is the outlier.'
  };
}, 'An outlier is a value much smaller or larger than the rest.');

S('data', 'bar-graph', 'Interpret bar graphs', r => {
  const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  const vals = [RI(r, 4, 10), RI(r, 4, 10), RI(r, 4, 10), RI(r, 4, 10), RI(r, 4, 10)];
  vals[RI(r, 0, 4)] = 12;
  const kind = RI(r, 1, 3);
  const total = vals.reduce((a, b) => a + b, 0);
  const max = Math.max(...vals), min = Math.min(...vals);
  if (kind === 1) return {
    q: 'The bar graph shows books sold each day. How many books were sold altogether?' + barChartHTML(labels, vals, 'books'),
    type: 'num', a: total,
    sol: 'Add the five bars: ' + vals.join(' + ') + ' = <strong>' + total + '</strong>.'
  };
  if (kind === 2) return {
    q: 'The bar graph shows books sold each day. How many more books were sold on the best day than on the worst day?' + barChartHTML(labels, vals, 'books'),
    type: 'num', a: max - min,
    sol: 'Best day = ' + max + ', worst day = ' + min + '.<br>' + max + ' − ' + min + ' = <strong>' + (max - min) + '</strong>.'
  };
  return {
    q: 'The bar graph shows books sold each day. On which day were the most books sold?' + barChartHTML(labels, vals, 'books'),
    type: 'choice', a: vals.indexOf(max),
    choices: labels,
    sol: 'The tallest bar is on <strong>' + labels[vals.indexOf(max)] + '</strong> (' + max + ' books).'
  };
}, 'Read the height of each bar from the scale.');

S('data', 'circle-graph', 'Interpret circle graphs', r => {
  const total = 20 * RI(r, 5, 15);
  const parts = [40, 25, 20, 15];
  const colors = ['#db3832', '#2563eb', '#0f766e', '#d97706'];
  const labels = ['Cats', 'Dogs', 'Birds', 'Fish'];
  const i = RI(r, 0, 3);
  const items = labels.map((label, j) => ({ label: label, value: parts[j], color: colors[j] }));
  return {
    q: 'The circle graph shows favourite pets in a school of ' + total + ' students. How many students chose <strong>' + labels[i] + '</strong>?' +
      pieChartHTML(items),
    type: 'num', a: parts[i] * total / 100,
    sol: labels[i] + ' = ' + parts[i] + '% of ' + total + '.<br>' + parts[i] + '% × ' + total + ' = <strong>' + (parts[i] * total / 100) + '</strong>.'
  };
}, 'Find the percent of the total for that sector.');

S('data', 'probability', 'Probability of one event', r => {
  const red = RI(r, 2, 8), blue = RI(r, 2, 8), green = RI(r, 2, 6);
  const total = red + blue + green;
  const f = F(red, total);
  return {
    q: 'A bag contains <strong>' + red + '</strong> red, <strong>' + blue + '</strong> blue and <strong>' + green + '</strong> green marbles. What is the probability of drawing a red marble? Write as a fraction in simplest form.',
    type: 'frac', a: f,
    sol: 'P(red) = number of red ÷ total = ' + fh(red, total) + ' = <strong>' + fHTML(f) + '</strong>.'
  };
}, 'Probability = favourable outcomes ÷ total outcomes.');

S('data', 'complement', 'Probability of opposite events', r => {
  const red = RI(r, 2, 8), blue = RI(r, 2, 8);
  const total = red + blue;
  const f = F(blue, total);
  return {
    q: 'A bag contains <strong>' + red + '</strong> red and <strong>' + blue + '</strong> blue marbles. What is the probability of <strong>not</strong> drawing a red marble?',
    type: 'frac', a: f,
    sol: 'P(not red) = 1 − P(red) = 1 − ' + fh(red, total) + ' = ' + fh(blue, total) + ' = <strong>' + fHTML(f) + '</strong>.'
  };
}, 'P(not A) = 1 − P(A).');

S('data', 'counting', 'Counting principle', r => {
  const a = RI(r, 2, 5), b = RI(r, 2, 5);
  return {
    q: 'A café offers <strong>' + a + '</strong> main dishes and <strong>' + b + '</strong> desserts. How many different main-and-dessert combinations are possible?',
    type: 'num', a: a * b,
    sol: 'Multiply the choices: ' + a + ' × ' + b + ' = <strong>' + (a * b) + '</strong> combinations.'
  };
}, 'Multiply the number of options at each stage.');

S('data', 'predictions', 'Make predictions', r => {
  const sections = pick(r, [4, 5, 8, 10]);
  const red = RI(r, 1, sections - 1);
  const trials = sections * RI(r, 10, 60);
  const f = F(red, sections);
  const expected = red * trials / sections;
  return {
    q: 'A spinner has <strong>' + sections + '</strong> equal sections, and <strong>' + red + '</strong> of them are red. If you spin <strong>' + trials + '</strong> times, about how many times should you land on red?',
    type: 'num', a: expected,
    sol: 'P(red) = ' + fh(red, sections) + '.<br>Expected = ' + fh(red, sections) + ' × ' + trials + ' = <strong>' + expected + '</strong>.'
  };
}, 'Expected count = probability × number of trials.');

S('data', 'statistical', 'Identify statistical questions', r => {
  const items = [
    ['How tall are the students in my class?', ['How tall is my teacher?', 'What is the height of the door?', 'How many students are in my class?'], true],
    ['How many pets does each student in Year 7 own?', ['How many pets does Sam own?', 'What is the most popular pet?', 'How old is the school cat?'], true],
    ['What is the favourite sport of each student in the class?', ['What sport does Maria play?', 'How many sports are in the Olympics?', 'What is the school’s address?'], true],
    ['How many minutes do students spend on homework each night?', ['How long is the maths lesson?', 'How many minutes are in an hour?', 'When does school start?'], true]
  ];
  const it = pick(r, items);
  return choiceQ(r, 'Which of these is a <strong>statistical question</strong>?', it[0], it[1],
    'A statistical question expects variety in the answers, so you collect data. <strong>' + it[0] + '</strong> does this.');
}, 'A statistical question anticipates different answers from different people.');

/* ============================================================
   App shell, routing, progress and practice engine
   ============================================================ */

const STORE_KEY = 'etx-myp1-maths-v1';
const MASTERY_STREAK = 8;
const SESSION_LEN = 15;
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

const SKILL_MAP = {};
SKILLS.forEach(s => { SKILL_MAP[s.id] = s; });
const UNIT_MAP = {};
UNITS.forEach(u => { UNIT_MAP[u.id] = u; });

/* ---------- storage ---------- */
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        s.skills = s.skills || {};
        s.xp = s.xp || 0;
        s.gameBest = s.gameBest || {};
        return s;
      }
    }
  } catch (e) { /* ignore */ }
  return { skills: {}, xp: 0, sessions: 0, lastSkill: null, dayStreak: 0, lastDay: null, gameBest: {} };
}
let store = loadStore();
store.gameBest = store.gameBest || {};
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
}
function stateOf(id) {
  if (!store.skills[id]) store.skills[id] = { a: 0, c: 0, s: 0, b: 0, m: false };
  return store.skills[id];
}
function isMastered(id) { return !!stateOf(id).m; }
function progressOf(id) {
  const st = stateOf(id);
  if (st.m) return 100;
  return Math.min(100, Math.round(((st.s || 0) / MASTERY_STREAK) * 100));
}
function masteredCount() { return SKILLS.filter(s => isMastered(s.id)).length; }
function unitSkills(uid) { return SKILLS.filter(s => s.unit === uid); }
function unitProgress(uid) {
  const list = unitSkills(uid);
  const n = list.filter(s => isMastered(s.id)).length;
  return { done: n, total: list.length, pct: list.length ? Math.round(n / list.length * 100) : 0 };
}
function localDay(offset) {
  const d = new Date();
  if (offset) d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function touchDay() {
  const today = localDay(0);
  if (store.lastDay !== today) {
    const y = localDay(-1);
    store.dayStreak = store.lastDay === y ? (store.dayStreak || 0) + 1 : 1;
    store.lastDay = today;
    saveStore();
  }
}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function ix(n) { return String(n).padStart(2, '0'); }
function ringSVG(pct, size, stroke, color) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-opacity=".15" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
    '</svg>';
}

/* ---------- session ---------- */
let session = null;
let selectedChoice = null;

function seedQ(skill, seed) {
  let q = null;
  for (let t = 0; t < 8; t++) {
    try {
      q = skill.gen(makeRng((seed + t * 7919) >>> 0));
    } catch (e) { q = null; }
    if (q && q.q && q.type) break;
  }
  if (!q) {
    q = { q: 'Which number is <strong>7 + 5</strong>?', type: 'num', a: 12, sol: '7 + 5 = 12.' };
  }
  q.skillId = skill.id;
  return q;
}

function makeSession(ids, mode, title) {
  const base = (Date.now() % 1000000007) + Math.floor(Math.random() * 100000);
  const questions = [];
  for (let i = 0; i < SESSION_LEN; i++) {
    const id = ids[i % ids.length];
    questions.push(seedQ(SKILL_MAP[id], base + i * 104729 + Math.floor(Math.random() * 5000)));
  }
  session = {
    ids: ids.slice(), mode: mode, title: title, questions: questions,
    idx: 0, correct: 0, results: [], answered: false, lastOk: false,
    input: '', fracWhole: '', fracNum: '', fracDen: '', showHint: false, finished: false, xp: 0
  };
  selectedChoice = null;
}

function startSkill(id, silent) {
  const skill = SKILL_MAP[id];
  if (!skill) { navigate('#/home'); return; }
  makeSession(Array(SESSION_LEN).fill(id), 'skill', skill.name);
  store.lastSkill = id;
  saveStore();
  if (!silent) {
    renderNav();
    renderView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function startUnit(uid) {
  const ids = unitSkills(uid).map(s => s.id);
  if (!ids.length) return;
  makeSession(ids, 'unit', UNIT_MAP[uid].name);
  renderNav(); renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function startMix() {
  const weak = SKILLS.filter(s => !isMastered(s.id));
  const pool = weak.length ? weak : SKILLS;
  const ids = [];
  for (let i = 0; i < SESSION_LEN; i++) {
    ids.push(pool[Math.floor(Math.random() * pool.length)].id);
  }
  makeSession(ids, 'mix', 'Daily mix');
  renderNav(); renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function currentQ() { return session ? session.questions[session.idx] : null; }

function recordAnswer(q, ok) {
  const st = stateOf(q.skillId);
  st.a = (st.a || 0) + 1;
  if (ok) {
    st.c = (st.c || 0) + 1;
    st.s = (st.s || 0) + 1;
    st.b = Math.max(st.b || 0, st.s);
    if (st.s >= MASTERY_STREAK) st.m = true;
    store.xp = (store.xp || 0) + 10;
    session.xp += 10;
  } else {
    st.s = 0;
    store.xp = (store.xp || 0) + 2;
    session.xp += 2;
  }
  session.correct += ok ? 1 : 0;
  saveStore();
}

/* ---------- routing ---------- */
function navigate(hash) {
  if (location.hash === hash) { route(); }
  else { location.hash = hash; }
}
function route() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  if (guide) closeGuide();
  if (sprint) stopSprint();
  document.body.classList.remove('nav-open');
  const root = document.documentElement;
  const prevBehavior = root.style.scrollBehavior;
  root.style.scrollBehavior = 'auto';
  window.scrollTo(0, 0);
  root.style.scrollBehavior = prevBehavior;
  if (h.indexOf('skill/') === 0) {
    const id = h.slice(6);
    if (SKILL_MAP[id]) { startSkill(id, true); renderNav(); renderView(); return; }
  }
  if (h.indexOf('unit/') === 0) {
    const id = h.slice(5);
    if (UNIT_MAP[id]) { renderNav(); renderUnit(id); return; }
  }
  if (h === 'mix') { startMix(); return; }
  if (h === 'game') { renderNav(); renderGameSetup(); return; }
  if (h === 'teacher') { renderNav(); renderTeacherNotes(); return; }
  renderNav(); renderHome();
}
window.addEventListener('hashchange', route);

function sidebarHTML() {
  return '<aside class="sidebar" id="sidebar"><div class="side-inner">' +
    '<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search skills…" autocomplete="off" aria-label="Search skills"></label>' +

      '<p class="nav-label">Learn</p>' +
      '<button class="nav-link" data-action="home"><span>⌂</span> Home</button>' +
      '<button class="nav-link" data-action="mix"><span>⚡</span> Daily mix</button>' +
      '<button class="nav-link" data-action="game"><span>🚀</span> Math Sprint</button>' +
      '<p class="nav-label">For teachers</p>' +
      '<button class="nav-link" data-action="teacher"><span>✎</span> IB MYP unit notes</button>' +

    '</nav>' +
    '<div class="side-foot">' +
      '<div class="overall"><span>Overall progress</span><strong id="side-pct">0%</strong></div>' +
      '<div class="bar"><i id="side-bar" style="width:0%"></i></div>' +

  '<div class="scrim" data-action="menu"></div>';

function mount() {
  touchDay();
  document.getElementById('app').innerHTML =
    headerHTML() + '<div class="shell">' + sidebarHTML() + '<main id="main" class="main"></main></div>';
  renderNav();
  route();
}

function renderNav() {
  const pct = SKILLS.length ? Math.round(masteredCount() / SKILLS.length * 100) : 0;
  const xp = document.getElementById('stat-xp');
  if (!xp) return;
  xp.textContent = (store.xp || 0).toLocaleString('en-US') + ' XP';
  document.getElementById('stat-mastered').textContent = masteredCount() + ' / ' + SKILLS.length + ' mastered';
  document.getElementById('stat-streak').textContent = (store.dayStreak || 1) + '-day streak';
  document.getElementById('side-pct').textContent = pct + '%';
  document.getElementById('side-bar').style.width = pct + '%';

  let nav = '';
  UNITS.forEach(u => {
    const p = unitProgress(u.id);
    nav += '<button class="nav-unit" data-action="unit" data-unit="' + u.id + '" style="--uc:' + u.color + '">' +
      '<span class="nu-glyph">' + u.glyph + '</span>' +
      '<span class="nu-text"><span class="nu-name">' + u.name + '</span>' +
      '<span class="nu-bar"><i style="width:' + p.pct + '%"></i></span></span>' +
      '<span class="nu-pct">' + p.pct + '%</span>' +
    '</button>';
  });
  document.getElementById('nav-units').innerHTML = nav;
}

/* ---------- skill guide: explanation + animated worked example ---------- */
let guide = null;
let guideRoot = null;
let guideSpeed = 4500;
try {
  const savedSpeed = Number(localStorage.getItem('etx-guide-speed'));
  if (savedSpeed) guideSpeed = savedSpeed;
} catch (e) { /* ignore */ }

function guideSeed() {
  return (Date.now() + Math.floor(Math.random() * 100000)) >>> 0;
}
function guideSteps(skill, q) {
  const steps = [
    { label: 'Question', html: q.q },
    { label: 'Method', html: skill.hint || 'Read the question, choose a method, then work step by step.' }
  ];
  const lines = String(q.sol || '').split(/<br\s*\/?>/i).map(function (s) { return s.trim(); }).filter(Boolean);
  lines.forEach(function (line, i) {
    steps.push({ label: 'Step ' + (i + 1), html: line });
  });
  steps.push({ label: 'Answer', html: '<strong>' + answerDisplay(q) + '</strong>' });
  return steps;
}
function ensureModalRoot() {
  if (!guideRoot) {
    guideRoot = document.getElementById('modal-root');
    if (!guideRoot) {
      guideRoot = document.createElement('div');
      guideRoot.id = 'modal-root';
      document.body.appendChild(guideRoot);
    }
  }
  return guideRoot;
}
function openGuide(id, mode, existingQ) {
  const skill = SKILL_MAP[id];
  if (!skill) return;
  const q = existingQ || seedQ(skill, guideSeed());
  guide = {
    skill: skill, q: q, steps: guideSteps(skill, q), index: 0,
    tab: mode === 'animate' ? 'animate' : 'explain',
    playing: false, timer: null, speed: guideSpeed, returnFocus: document.activeElement
  };
  document.body.classList.add('modal-open');
  if (guide.tab === 'animate') startGuidePlay();
  else renderGuide();
  setTimeout(function () { const x = document.querySelector('.modal-x'); if (x) x.focus(); }, 40);
}
function renderGuide() {
  if (!guide) return;
  const root = ensureModalRoot();
  const u = UNIT_MAP[guide.skill.unit];
  const n = MYP_NOTES[u.id];
  const speeds = [[6000, 'Very slow'], [4500, 'Slow'], [3000, 'Normal'], [2200, 'Fast']];
  const speedSelect = '<label class="guide-speed"><span>Speed</span><select id="guide-speed" aria-label="Animation speed">' +
    speeds.map(function (s) { return '<option value="' + s[0] + '"' + (guide.speed === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') +
  '</select></label>';
  const tabs = '<div class="guide-tabs">' +
    '<button class="guide-tab ' + (guide.tab === 'explain' ? 'active' : '') + '" data-action="guide-tab" data-tab="explain">Explanation</button>' +
    '<button class="guide-tab ' + (guide.tab === 'animate' ? 'active' : '') + '" data-action="guide-tab" data-tab="animate">Animated task</button>' +
  '</div>';
  let body = '';
  if (guide.tab === 'explain') {
    const keyIdeas = n && n.keyIdeas
      ? '<div class="guide-keyideas"><strong>Key ideas from this unit</strong><ul>' + n.keyIdeas.map(function (k) { return '<li>' + k + '</li>'; }).join('') + '</ul></div>'
      : '';
    body = '<div class="guide-about"><strong>What this guide covers</strong><p>This guide focuses on <strong>' + guide.skill.name.toLowerCase() + '</strong> within ' + u.name + '. ' +
      (n ? n.explanation : '') + ' Use the method below, then follow the animated example.</p></div>' +
      '<div class="guide-method"><strong>Method</strong><p>' + (guide.skill.hint || 'Follow the worked example step by step.') + '</p></div>' +
      keyIdeas +
      '<div class="guide-example"><p class="guide-label">Worked example</p>' +
        '<div class="guide-q">' + guide.q.q + '</div>' +
        '<div class="guide-sol">' + (guide.q.sol || '') + '</div>' +
        '<p class="guide-answer">Answer: <strong>' + answerDisplay(guide.q) + '</strong></p>' +
      '</div>' +
      '<div class="guide-actions">' +
        '<button class="guide-btn primary" data-action="guide-tab" data-tab="animate">▶ Play animated task</button>' +
        '<button class="guide-btn" data-action="guide-new">New example</button>' +
        '<button class="guide-btn" data-action="guide-practice">Practise this skill →</button>' +
      '</div>';
  } else {
    const step = guide.steps[guide.index];
    const last = guide.index >= guide.steps.length - 1;
    const dots = guide.steps.map(function (s, i) {
      return '<span class="guide-dot ' + (i < guide.index ? 'done' : i === guide.index ? 'now' : '') + '"></span>';
    }).join('');
    body = '<div class="guide-player">' +
      '<div class="guide-step-label">Step ' + (guide.index + 1) + ' of ' + guide.steps.length + ' · ' + step.label + '</div>' +
      '<div class="guide-step" aria-live="polite">' + step.html + '</div>' +
      '<div class="guide-dots">' + dots + '</div>' +
      '<div class="guide-controls">' +
        '<button class="guide-btn" data-action="guide-prev"' + (guide.index === 0 ? ' disabled' : '') + '>← Back</button>' +
        '<button class="guide-btn primary" data-action="guide-play">' + (guide.playing ? 'Pause' : (last ? 'Replay' : 'Play')) + '</button>' +
        '<button class="guide-btn" data-action="guide-next"' + (last ? ' disabled' : '') + '>Next →</button>' +
        '<button class="guide-btn" data-action="guide-new">New example</button>' +
        '<button class="guide-btn" data-action="guide-practice">Practise this skill →</button>' +
        speedSelect +
      '</div>' +
      '<p class="guide-meta"><span>A fresh example each time</span><span>' + guide.steps.length + ' steps</span></p>' +
    '</div>';
  }
  root.innerHTML = '<div class="modal-scrim"><div class="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">' +
    '<button class="modal-x" data-action="close-guide" aria-label="Close guide">×</button>' +
    '<p class="eyebrow dark">Unit ' + u.num + ' · ' + u.name + '</p>' +
    '<h2 id="guide-title">' + guide.skill.name + '</h2>' +
    tabs + body +
  '</div></div>';
}
function stopGuideTimer() {
  if (guide && guide.timer) { clearInterval(guide.timer); guide.timer = null; }
}
function guideTick() {
  if (!guide) return;
  if (guide.index < guide.steps.length - 1) {
    guide.index++;
    renderGuide();
  } else {
    pauseGuide();
  }
}
function startGuideTimer() {
  if (!guide) return;
  stopGuideTimer();
  guide.timer = setInterval(guideTick, guide.speed || 4500);
}
function startGuidePlay() {
  if (!guide) return;
  stopGuideTimer();
  if (guide.index >= guide.steps.length - 1) guide.index = 0;
  guide.tab = 'animate';
  guide.playing = true;
  renderGuide();
  startGuideTimer();
}
function pauseGuide() {
  if (!guide) return;
  guide.playing = false;
  stopGuideTimer();
  renderGuide();
}
function guideStep(delta) {
  if (!guide) return;
  stopGuideTimer();
  guide.playing = false;
  guide.index = Math.max(0, Math.min(guide.steps.length - 1, guide.index + delta));
  renderGuide();
}
function closeGuide() {
  stopGuideTimer();
  const returnFocus = guide && guide.returnFocus;
  guide = null;
  document.body.classList.remove('modal-open');
  if (guideRoot) guideRoot.innerHTML = '';
  if (returnFocus && returnFocus.focus) { try { returnFocus.focus(); } catch (e) { /* ignore */ } }
}
function newGuideExample() {
  if (!guide) return;
  const wasPlaying = guide.playing;
  stopGuideTimer();
  guide.q = seedQ(guide.skill, guideSeed());
  guide.steps = guideSteps(guide.skill, guide.q);
  guide.index = 0;
  guide.playing = false;
  if (wasPlaying || guide.tab === 'animate') startGuidePlay();
  else renderGuide();
}
